    el.style.setProperty("--acc-bg", "rgba(" + c.r + "," + c.g + "," + c.b + ",.16)");
  }
  function hintText(r){ return r.posterHint ? SHELL.rituals.cardLabel + ": " + r.posterHint : ""; }
  // Featured = the PRO ritual («Полночная перекличка»): title + blurb + tags, dial-at-03:00 art
  function featuredCard(r){
    const el = document.createElement("div");
    el.className = "card rit-featured" + (ritualId === r.id ? " on" : "") + (ritualLocked(r) ? " locked" : "");
    accentVars(el, r);
    el.innerHTML =
      '<button type="button" class="rt"><b></b><small></small><span class="tags">' + ritualTags(r) + '</span><span class="hint"></span></button>' + CLOCK_ART;
    el.querySelector("b").textContent = r.title;
    el.querySelector("small").textContent = r.blurb;
    el.querySelector(".hint").textContent = hintText(r);
    el.querySelector(".rt").addEventListener("click", function(){ tapRitual(r); });
    el.appendChild(heartBtn(r));
    return el;
  }
  function ritualItem(r){
    const locked = ritualLocked(r);
    const el = document.createElement("div");
    el.className = "card rit-item" + (ritualId === r.id ? " on" : "") + (locked ? " locked" : "");
    accentVars(el, r);
    el.innerHTML =
      '<span class="thumb' + (locked ? " gold" : " acc") + '" aria-hidden="true">' + ritualIcon(r) + '</span>' +
      '<button type="button" class="rt"><b></b><small></small><span class="hint"></span>' + (ritualTags(r) ? '<span class="tags">' + ritualTags(r) + '</span>' : "") + '</button>';
    el.querySelector("b").textContent = r.title;
    el.querySelector("small").textContent = r.blurb;
    el.querySelector(".hint").textContent = hintText(r);
    el.querySelector(".rt").addEventListener("click", function(){ tapRitual(r); });
    el.appendChild(heartBtn(r));
    const chev = document.createElement("button");
    chev.type = "button";
    chev.className = "chev";
    chev.setAttribute("aria-label", locked ? SHELL.rituals.locked : (ritualId === r.id ? SHELL.rituals.unselect : SHELL.rituals.select));
    chev.innerHTML = locked ? ICO.lock : (ritualId === r.id ? ICO.check : ICO.chevron);
    chev.addEventListener("click", function(){ tapRitual(r); });
    el.appendChild(chev);
    return el;
  }
  function renderRituals(){
    $("ritTitle").textContent = SHELL.rituals.title;
    $("ritHint").textContent = SHELL.rituals.hint;
    renderSeg($("ritSeg"), SHELL.rituals.tabs, ["all", "fav"], ritFilter, function(v){ ritFilter = v; renderRituals(); });
    const fwrap = $("ritFeatured"), list = $("ritList");
    fwrap.innerHTML = "";
    list.innerHTML = "";
    const favOnly = ritFilter === "fav";
    const items = RITUALS.filter(function(r){ return !favOnly || profile.favRituals.indexOf(r.id) >= 0; });
    const feat = favOnly ? null : items.filter(function(r){ return r.pro; })[0];
    if(feat) fwrap.appendChild(featuredCard(feat));
    const rest = items.filter(function(r){ return r !== feat; });
    if(!rest.length && !feat){ list.appendChild(emptyState(SHELL.empty.ritualFav, function(){ ritFilter = "all"; renderRituals(); })); return; }
    rest.forEach(function(r){ list.appendChild(ritualItem(r)); });
  }

  /* ---------- profile home ---------- */
  function userRank(period){
    const scale = SHELL.leaderboard.periodScale[period || "all"] || 1;
    const mine = period === "all" || !period ? karmaAll() : karmaSince(Date.now() - (period === "week" ? 7 : 30) * 864e5);
    let rank = 1;
    SHELL.leaderboard.seeds.forEach(function(s){ if(Math.round(s.karma * scale) > mine) rank++; });
    return rank;
  }
  function renderProfileHome(){
    $("profTitle").textContent = SHELL.profile.title;
    $("nickText").textContent = displayNick();
    const proTag = $("proTag");
    proTag.textContent = SHELL.profile.proTag;
    proTag.classList.toggle("hidden", !profile.pro);
    $("nickSave").textContent = SHELL.profile.saveNick;
    $("nickInput").placeholder = SHELL.profile.nickPlaceholder;
    $("nickInput").maxLength = SHELL.profile.nickMax || 24;
    $("since").textContent = fmt(SHELL.profile.since, { year: new Date(profile.createdAt || Date.now()).getFullYear() });

    const counters = $("profCounters");
    counters.innerHTML = "";
    [[stats.total | 0, SHELL.profile.counters[0]], [fmtK(karmaAll()), SHELL.profile.counters[1]], [favCount(), SHELL.profile.counters[2]]].forEach(function(c){
      const d = document.createElement("div");
      d.className = "card counter-card";
      d.innerHTML = "<b></b><small></small>";
      d.querySelector("b").textContent = c[0];
      d.querySelector("small").textContent = c[1];
      counters.appendChild(d);
    });

    const pct = worsePct();
    $("worseText").textContent = fmt(SHELL.profile.worldWorse, { x: pct });
    requestAnimationFrame(function(){ $("worseBar").style.width = pct + "%"; });

    const banner = $("proBanner");
    banner.classList.toggle("hidden", !!profile.pro);
    $("proBannerTitle").textContent = SHELL.profile.proBanner.title;
    $("proBannerSub").textContent = SHELL.profile.proBanner.sub;
    $("proBannerCta").textContent = SHELL.profile.proBanner.cta;

    const menu = $("profMenu");
    menu.innerHTML = "";
    SHELL.profile.menu.forEach(function(m){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "menu-item";
      b.dataset.page = m.id;
      let val = "", gold = false, label = m.label;
      if(m.id === "badges") val = profile.badges.length + "/" + SHELL.badges.items.length;
      else if(m.id === "stats") val = String(stats.total | 0);
      else if(m.id === "leaderboard") val = "#" + userRank("all");
      else if(m.id === "premium"){ if(profile.pro){ label = m.labelPro; val = SHELL.rituals.locked; gold = true; } }
      b.innerHTML = '<span class="mi" aria-hidden="true">' + (MENU_ICONS[m.id] || ICO.info) + '</span><span class="lbl"></span><span class="val' + (gold ? " gold" : "") + '"></span><span class="chev" aria-hidden="true">' + ICO.chevron + '</span>';
      b.querySelector(".lbl").textContent = label;
      b.querySelector(".val").textContent = val;
      b.addEventListener("click", function(){ vibe(VIBE.light); showPage("profile", m.id); });
      menu.appendChild(b);
    });
    $("nickForm").classList.remove("on");
  }
  $("nickEditBtn").addEventListener("click", function(){
    const f = $("nickForm");
    const on = !f.classList.contains("on");
    f.classList.toggle("on", on);
    if(on){
      $("nickInput").value = profile.nick || "";
      try{ $("nickInput").focus(); }catch(e){}
    }
    vibe(VIBE.light);
  });
  $("nickForm").addEventListener("submit", function(e){
    e.preventDefault();
    const v = ($("nickInput").value || "").replace(/\s+/g, " ").trim().slice(0, SHELL.profile.nickMax || 24);
    profile.nick = v;
    saveProfile();
    showToast(SHELL.profile.nickSaved);
    vibe(VIBE.light);
    renderProfileHome();
  });
  $("proBanner").addEventListener("click", function(){ vibe(VIBE.light); showPage("profile", "premium"); });

  /* ---------- badges ---------- */
  function renderBadges(){
    $("badgesTitle").textContent = SHELL.badges.title;
    const items = SHELL.badges.items;
    $("badgesProgress").textContent = fmt(SHELL.badges.progress, { n: profile.badges.length, total: items.length });
    const grid = $("badgeGrid");
    grid.innerHTML = "";
    items.forEach(function(b){
      const on = profile.badges.indexOf(b.id) >= 0;
      const d = document.createElement("div");
      d.className = "card badge" + (on ? " on" : "");
      d.dataset.id = b.id;
      d.innerHTML = '<span class="lock" aria-hidden="true">' + ICO.lock + '</span><span class="bi" aria-hidden="true">' + (ICO[SHELL.badges.icons[b.id]] || ICO.star) + '</span><b></b><small></small>';
      d.querySelector("b").textContent = b.title;
      d.querySelector("small").textContent = b.blurb;
      d.setAttribute("aria-label", b.title + " — " + (on ? b.blurb : SHELL.badges.locked));
      grid.appendChild(d);
    });
  }

  /* ---------- stats ---------- */
  const WEEKDAYS = ["вс","пн","вт","ср","чт","пт","сб"];
  function renderStats(){
    $("statsTitle").textContent = SHELL.stats.title;
    const body = $("statsBody");
    body.innerHTML = "";
    const pct = worsePct();

    const hero = document.createElement("div");
    hero.className = "card stat-hero";
    hero.innerHTML = '<div class="eyebrow"></div><div class="big"><b></b></div><p class="sentence"></p><div class="bars"></div><div class="bars-labels"></div><div class="bars-cap"></div>';
    hero.querySelector(".eyebrow").textContent = SHELL.profile.counters[1] + " · " + fmtK(karmaAll());
    hero.querySelector(".big b").textContent = pct + "%";
    hero.querySelector(".sentence").textContent = fmt(SHELL.stats.worldWorse, { x: pct });
    const bars = hero.querySelector(".bars"), labels = hero.querySelector(".bars-labels");
    const days = [];
    for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
    let max = 0;
    days.forEach(function(d){ max = Math.max(max, stats.byDay[dayKey(d)] || 0); });
    days.forEach(function(d){
      const n = stats.byDay[dayKey(d)] || 0;
      const i = document.createElement("i");
      i.style.height = (max ? Math.max(4, Math.round(n / max * 100)) : 4) + "%";
      if(!n) i.classList.add("zero");
      i.title = n + "";
      bars.appendChild(i);
      const l = document.createElement("span");
      l.textContent = WEEKDAYS[d.getDay()];
      labels.appendChild(l);
    });
    hero.querySelector(".bars-cap").textContent = SHELL.stats.chartLabel;
    body.appendChild(hero);

    const cards = document.createElement("div");
    cards.className = "stat-cards";
    const cleanPct = stats.total ? Math.round((stats.clean | 0) / stats.total * 100) + "%" : "0%";
    [[stats.total | 0, SHELL.stats.cards[0]], [stats.byPower.anathema | 0, SHELL.stats.cards[1]], [cleanPct, SHELL.stats.cards[2]], [favCount(), SHELL.stats.cards[3]]].forEach(function(c){
      const d = document.createElement("div");
      d.className = "card stat-card";
      d.innerHTML = "<b></b><small></small>";
      d.querySelector("b").textContent = c[0];
      d.querySelector("small").textContent = c[1];
      cards.appendChild(d);
    });
    body.appendChild(cards);

    const pw = document.createElement("div");
    pw.className = "card pbars";
    pw.innerHTML = '<div class="group-label"></div>';
    pw.querySelector(".group-label").textContent = SHELL.stats.byPower;
    const totalP = Math.max(1, stats.total | 0);
    powers.forEach(function(p){
      const n = stats.byPower[p.id] | 0;
      const row = document.createElement("div");
      row.className = "pbar";
      row.style.setProperty("--bar", powerColorOf(p.id));
      row.innerHTML = "<span></span><div class=\"track\"><i></i></div><em></em>";
      row.querySelector("span").textContent = p.label;
      row.querySelector("i").style.width = Math.round(n / totalP * 100) + "%";
      row.querySelector("em").textContent = n;
      pw.appendChild(row);
    });
    body.appendChild(pw);

    const catKeys = Object.keys(stats.byCategory).filter(function(k){ return stats.byCategory[k] > 0; })
      .sort(function(a, b){ return stats.byCategory[b] - stats.byCategory[a]; }).slice(0, 5);
    if(catKeys.length){
      const pc = document.createElement("div");
      pc.className = "card pbars";
      pc.innerHTML = '<div class="group-label"></div>';
      pc.querySelector(".group-label").textContent = SHELL.stats.byCategory;
      catKeys.forEach(function(k){
        const n = stats.byCategory[k] | 0;
        const c = catById(k);
        const row = document.createElement("div");
        row.className = "pbar";
        row.style.setProperty("--bar", "#C9A24A");
        row.innerHTML = "<span></span><div class=\"track\"><i></i></div><em></em>";
        row.querySelector("span").textContent = c ? c.title : SHELL.stats.noCategory;
        row.querySelector("i").style.width = Math.round(n / totalP * 100) + "%";
        row.querySelector("em").textContent = n;
        pc.appendChild(row);
      });
      body.appendChild(pc);
    }
  }

  /* ---------- leaderboard ---------- */
  let lbPeriod = "all";
  function renderLeaderboard(){
    $("lbTitle").textContent = SHELL.leaderboard.title;
    $("lbSub").textContent = SHELL.leaderboard.subtitle;
    renderSeg($("lbSeg"), SHELL.leaderboard.tabs, ["week", "month", "all"], lbPeriod, function(v){ lbPeriod = v; renderLeaderboard(); });
    $("lbHead").textContent = SHELL.leaderboard.metric;
    const scale = SHELL.leaderboard.periodScale[lbPeriod] || 1;
    const mine = lbPeriod === "all" ? karmaAll() : karmaSince(Date.now() - (lbPeriod === "week" ? 7 : 30) * 864e5);
    const rows = SHELL.leaderboard.seeds.map(function(s){ return { name: s.nick, karma: Math.round(s.karma * scale), me: false }; });
    rows.push({ name: displayNick(), karma: mine, me: true });
    // PRO bullet 5 — «Приоритет в локальной таблице кармы»: a legend wins ties, a mortal loses them.
    const meFirst = profile.pro ? -1 : 1;
    rows.sort(function(a, b){ return (b.karma - a.karma) || (a.me ? meFirst : b.me ? -meFirst : 0); });
    const list = $("lbList");
    list.innerHTML = "";
    rows.forEach(function(r, i){
      const row = document.createElement("div");
      row.className = "lb-row" + (r.me ? " me" : "") + (i < 3 ? " top" : "");
      row.innerHTML = '<span class="rank"></span><span class="av" aria-hidden="true"></span><span class="nm"><span></span></span><span class="kv"></span>';
      row.querySelector(".rank").textContent = i + 1;
      row.querySelector(".av").textContent = (r.name || "?").trim().charAt(0).toUpperCase();
      row.querySelector(".nm > span").textContent = r.name;
      if(r.me){
        if(profile.pro) row.querySelector(".nm").insertAdjacentHTML("beforeend", ICO.crownGold);
        const you = document.createElement("span");
        you.className = "you";
        you.textContent = "(" + SHELL.leaderboard.you + ")";
        row.querySelector(".nm").appendChild(you);
        row.setAttribute("aria-current", "true");
      }
      row.querySelector(".kv").textContent = fmtK(r.karma);
      list.appendChild(row);
    });
  }

  /* ---------- PRO mock paywall («Стать легендой» — local flag only, no payments) ---------- */
  function setPro(on){
    profile.pro = !!on;
    saveProfile();
    document.body.classList.toggle("is-pro", profile.pro);
    if(profile.pro) checkBadges();
    if(!profile.pro && ritualLocked(ritualById(ritualId))) setRitual(null);
    if(!profile.pro && categoryLocked(catById(categoryId))) clearCategory({ silent: true });
  }
  function renderPremium(){
    $("proTitle").textContent = SHELL.pro.title;
    $("payTitleSmall").textContent = SHELL.pro.eyebrow;
    const list = $("perkList");
    list.innerHTML = "";
    SHELL.pro.bullets.forEach(function(text, i){
      const d = document.createElement("div");
      d.className = "perk";
      d.innerHTML = '<span class="pi" aria-hidden="true">' + (ICO[SHELL.pro.perkIcons[i]] || ICO.star) + '</span><span></span>';
      d.querySelector("span:last-child").textContent = text;
      list.appendChild(d);
    });
    const cta = $("proCta");
    cta.textContent = profile.pro ? SHELL.pro.ctaDone : SHELL.pro.cta;
    cta.disabled = !!profile.pro;
    $("proFine").textContent = SHELL.pro.fine;
  }
  $("proCta").addEventListener("click", function(){
    if(profile.pro) return;
    setPro(true);
    vibe(VIBE.anathema);
    showToast(SHELL.pro.unlocked);
    renderPremium();
  });

  /* ---------- settings ---------- */
  function renderSettings(){
    const S = SHELL.settings;
    $("settingsTitle").textContent = S.title;
    const body = $("settingsBody");
    body.innerHTML = "";
    function group(label){
      const g = document.createElement("div");
      g.className = "group";
      g.innerHTML = '<div class="group-label"></div>';
      g.querySelector(".group-label").textContent = label;
      body.appendChild(g);
      return g;
    }
    const gR = group(S.groups.ritual);
    gR.appendChild(toggleRow(ICO.noMat, S.noMat.label, S.noMat.desc, noMat, function(v){
      noMat = v;
      noMatBtn.setAttribute("aria-checked", noMat ? "true" : "false");
      savePrefs();
      renderSettings();
    }));
    const gP = group(S.groups.profile);
    gP.appendChild(toggleRow(ICO.eyeOff, S.anon.label, S.anon.desc, !!profile.anon, function(v){
      profile.anon = v;
      saveProfile();
      renderSettings();
    }));
    const gL = group(S.groups.look);
    gL.appendChild(toggleRow(ICO.moon, S.dark.label, S.dark.desc, true, null, true));
    const gD = group(S.groups.data);
    const clearBtn = actionRow(ICO.trash, S.clear.label, fmt(S.clear.desc, { n: history.length }), "danger");
    armConfirm(clearBtn, S.clear.confirm, function(){
      if(!history.length){ showToast(S.clear.empty); return; }
      history = [];
      saveHistory();
      if(lastVerdict){ lastVerdict.hid = null; syncFavBtn(); }
      vibe(VIBE.seal);
      showToast(S.clear.done);
      renderSettings();
    });
    gD.appendChild(clearBtn);
    if(profile.pro){
      const gX = group(S.groups.demo);
      const off = actionRow(ICO.crown, S.proOff.label, S.proOff.desc);
      off.addEventListener("click", function(){
        setPro(false);
        vibe(VIBE.light);
        showToast(S.proOff.done);
        renderSettings();
      });
      gX.appendChild(off);
    }
  }

  /* ---------- about ---------- */
  function renderAbout(){
    const A = SHELL.about;
    $("aboutTitle").textContent = A.title;
    $("aboutVer").textContent = fmt(A.version, { v: DATA.version });
    const box = $("aboutLines");
    box.innerHTML = "";
    A.lines.forEach(function(line){
      const p = document.createElement("p");
      p.textContent = line;
      box.appendChild(p);
    });
    $("aboutDisclaimer").textContent = A.disclaimer;
    const a = $("aboutLink");
    a.textContent = A.link;
    a.href = APP_URL;
  }

  /* ---------- boot ---------- */
  document.body.dataset.tab = curTab;
  renderTabbar();
  renderCtxRow();
  renderPopStrip();
  checkBadges({ silent: true });   // re-grant from stats for users whose badges predate the current ids

  // Exposed for smoke tests / debugging only
  try{
    window.__proklinator = {
      matchSin: matchSin, isVulgar: isVulgar, inferGender: inferGender, pickVerdict: pickVerdict,
      cleanLadder: cleanLadder, displaySinName: displaySinName, verdicts: DATA.verdicts,
      paintPoster: paintPoster, paintOgCard: paintOgCard, conjugate: conjugate,
      version: DATA.version, get last(){ return lastVerdict; },
      shell: SHELL, copy: SHELL_COPY, showTab: showTab, showPage: showPage, openProfilePage: openProfilePage,
      selectCategory: selectCategory, clearCategory: clearCategory, setRitual: setRitual, setPro: setPro,
      openHistoryEntry: openHistoryEntry, sinsForCategory: sinsForCategory, karmaAll: karmaAll, worsePct: worsePct,
      categoryHits: function(text){ return categoryHits(tokenize(text).map(stem)); }, inferCategory: inferCategory,
      resolveRitualId: resolveRitualId, resolveCatId: resolveCatId, checkBadges: checkBadges, authorSins: AUTHOR_SINS.slice(),
      popular: POPULAR.map(function(p){ return { label: p.label, sinId: p.sin.id, text: p.text }; }), fillPopular: function(i){ fillPopular(POPULAR[i]); },
      shareCard: shareCard,
      get history(){ return history; }, get stats(){ return stats; }, get profile(){ return profile; },
      get state(){ return { tab: curTab, page: pageOf.profile, powerId: powerId, noMat: noMat, categoryId: categoryId, ritualId: ritualId, casting: casting }; }
    };
  }catch(e){}
})();
</script>
</body>
</html>
