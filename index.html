}
@font-face{
  font-family:"Playfair Display";font-style:italic;font-weight:400 900;font-display:swap;
  src:url("fonts/playfair-display-italic-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
:root{
  --soot-950:#070505;
  --soot:#0B0908;
  --soot-800:#120E0D;
  --soot-700:#19140F;
  --soot-600:#221B17;
  --bone:#EDE4D6;
  --bone-dim:#A99E90;
  --bone-mute:#6E655B;
  --line:rgba(237,228,214,0.08);
  --line-strong:rgba(237,228,214,0.16);
  --blood:#B3121F;
  --blood-deep:#5E0A10;
  --blood-hot:#E5262F;
  --blood-dim:rgba(179,18,31,0.18);
  --blood-glow:rgba(179,18,31,0.45);
  --ember:#FF3B2F;
  --ash-rose:#A65A55;
  --gold:#C9A24A;
  --gold-hot:#E6C77A;
  --gold-dim:#8F7538;
  --gold-soft:rgba(201,162,74,0.28);
  --ink:#0B0908;

  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Playfair Display","Cormorant Garamond",Didot,"Bodoni 72","Times New Roman",Georgia,serif;

  --r-ctrl:16px;
  --r-card:18px;
  --r-pill:999px;
  --ease:cubic-bezier(0.32,0.72,0,1);
  --dur:200ms;
  --dur-breathe:2.3s;
  --accent:var(--blood);

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* hero geometry: header stack sits on the dark top of the altar image */
  --hero-h:calc(clamp(400px,128vw,540px) + var(--safe-t));
  --head-h:calc(186px + var(--safe-t));

  font-family:var(--font);
}
html[data-power="whisper"]{--accent:var(--ash-rose)}
html[data-power="seal"]{--accent:var(--blood)}
html[data-power="anathema"]{--accent:var(--ember)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
html,body{overflow-x:hidden;margin:0;min-height:100%;min-height:100dvh;background:var(--soot);color:var(--bone)}
body{
  overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:0 var(--safe-r) 0 var(--safe-l);
  background:
    radial-gradient(ellipse 90% 46% at 50% 14%,rgba(120,12,20,.22),transparent 62%),
    radial-gradient(ellipse 80% 40% at 50% 108%,rgba(0,0,0,.75),transparent 60%),
    linear-gradient(180deg,#0D0A09 0%,var(--soot) 40%,var(--soot-950) 100%);
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;mix-blend-mode:overlay;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:89;
  background:radial-gradient(ellipse 78% 72% at 50% 46%,transparent 42%,rgba(7,5,5,.66) 100%);
}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blood-hot);outline-offset:3px}
button:active:not(:disabled){transform:scale(.97);transition:transform 150ms var(--ease)}

.app{
  max-width:430px;margin:0 auto;min-height:100dvh;
  padding:0 20px calc(28px + var(--safe-b));
  position:relative;z-index:1;
}

/* ---- Hero altar (cinematic image, fades into soot) ---- */
.hero-bg{
  position:absolute;left:0;right:0;top:0;height:var(--hero-h);z-index:0;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%);
  mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%);
}
@media (min-width:480px){
  /* wide viewports: also feather the column edges so the image melts into the page background */
  .hero-bg{
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%),linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%),linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%);
    mask-composite:intersect;
  }
}
.hero-bg img{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:cover;object-position:50% 100%;opacity:0;transition:opacity 700ms ease;
}
.hero-bg.ready img{opacity:1}
.hero-bg.no-img img{display:none}
.hero-shade{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(11,9,8,.62) 0,rgba(11,9,8,.22) 20%,transparent 38%);
}
.hero-fallback{
  position:absolute;left:0;right:0;top:calc(var(--head-h) - 4px);height:calc(var(--hero-h) - var(--head-h) - 40px);
  display:none;place-items:center;
}
.hero-bg.no-img .hero-fallback{display:grid}
.hero-fallback svg{width:100%;height:100%;max-height:220px}
body.is-result .hero-bg{display:none}

/* ---- Header / brand ---- */
.close-btn{
  position:absolute;top:calc(14px + var(--safe-t));right:20px;z-index:4;
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(20,15,13,.78);border:1px solid var(--line-strong);color:var(--bone);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color var(--dur),background var(--dur);
}
.close-btn svg{width:16px;height:16px}
.close-btn:hover{border-color:rgba(237,228,214,.3);background:rgba(28,20,18,.9)}
.head{position:relative;z-index:1;text-align:center;padding-top:calc(14px + var(--safe-t))}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px}
.brand .crown{width:28px;height:21px;display:block;filter:drop-shadow(0 0 8px rgba(201,162,74,.35))}
.brand-name{
  font-family:var(--serif);font-size:17px;line-height:1.2;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone);font-weight:400;
}
.brand-name::first-letter{font-size:1.18em}
.tagline{
  font-family:var(--serif);font-size:9px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold);opacity:.9;
}
.screen-cast{position:relative;z-index:1}
.title{
  font-family:var(--serif);font-weight:400;font-size:clamp(38px,11.5vw,48px);line-height:1.05;
  margin:14px 0 8px;color:var(--bone);letter-spacing:-.01em;text-align:center;
  text-shadow:0 2px 24px rgba(0,0,0,.6);
}
.sub{
  margin:0 auto;max-width:224px;font-size:14px;line-height:1.4;color:var(--bone-dim);text-align:center;
  text-shadow:0 1px 12px rgba(0,0,0,.7);
}
.altar-space{height:calc(var(--hero-h) - var(--head-h) - 150px);min-height:110px}

/* ---- Fields ---- */
.field{display:block;margin:0 0 16px;position:relative}
.field-label,.section-label{
  display:block;font-size:16px;font-weight:500;color:var(--bone);margin:0 0 10px;letter-spacing:.005em;
}
.control{position:relative}
.control input,.control textarea{
  width:100%;font-size:17px;line-height:1.4;color:var(--bone);font-weight:400;
  background:linear-gradient(180deg,#1B1615,#151110);border:1px solid var(--line);border-radius:var(--r-ctrl);
  padding:15px 48px 15px 18px;outline:none;-webkit-appearance:none;appearance:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.25);
  transition:border-color var(--dur),box-shadow var(--dur);
}
.control textarea{min-height:104px;resize:none;display:block;overflow:hidden}
.control input:focus,.control textarea:focus{
  border-color:rgba(229,38,47,.55);
  box-shadow:0 0 0 3px rgba(179,18,31,.16),0 0 26px rgba(179,18,31,.14),inset 0 1px 0 rgba(255,255,255,.03);
}
.control input::placeholder,.control textarea::placeholder{color:var(--bone-mute);font-weight:400}
.control .clear-btn{
  position:absolute;right:13px;top:14px;width:26px;height:26px;border-radius:50%;display:none;place-items:center;
  background:rgba(237,228,214,.10);color:var(--bone-dim);transition:background var(--dur),color var(--dur);
}
.control.single .clear-btn{top:50%;transform:translateY(-50%)}
.control.single .clear-btn:active{transform:translateY(-50%) scale(.94)}
.control .clear-btn svg{width:12px;height:12px}
.control.has-value .clear-btn{display:grid}
.control .clear-btn:hover{background:rgba(237,228,214,.18);color:var(--bone)}
.counter{
  display:block;text-align:right;font-size:12px;color:var(--bone-mute);margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.counter.max{color:var(--blood-hot)}
.empty-hint{
  display:block;margin:2px 0 0;font-size:12px;color:var(--blood-hot);opacity:0;max-height:0;overflow:hidden;
  transition:opacity var(--dur),max-height var(--dur);
}
.empty-hint.show{opacity:1;max-height:2em}
.control.pulse-inner input,.control.pulse-inner textarea{animation:pulseInner .7s var(--ease)}
@keyframes pulseInner{
  0%,100%{box-shadow:0 0 0 0 transparent;border-color:var(--line)}
  30%{box-shadow:0 0 0 4px rgba(229,38,47,.3);border-color:var(--blood-hot)}
  60%{box-shadow:0 0 0 2px rgba(229,38,47,.16);border-color:var(--blood)}
}

/* ---- Power cards (segmented) ---- */
.power{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;
  border-radius:var(--r-card);border:1px solid var(--line);margin:0 0 14px;
  background:linear-gradient(180deg,#171312,#100D0C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.28);
}
.pow{
  position:relative;min-height:122px;border-radius:14px;border:1px solid transparent;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
  padding:16px 4px 13px;color:var(--bone-dim);text-align:center;overflow:hidden;
  transition:border-color var(--dur),color var(--dur),background var(--dur),box-shadow var(--dur),transform var(--dur) var(--ease);
}
.pow:hover,.pow:focus-visible{background:rgba(237,228,214,.03)}
.pow .ico{width:22px;height:22px;display:block;margin-bottom:5px;color:var(--bone-dim)}
.pow .ico svg{width:100%;height:100%;display:block}
.pow b{font-size:15px;font-weight:600;color:var(--bone);letter-spacing:0;line-height:1.2;white-space:nowrap}
.pow small{font-size:10.5px;color:var(--bone-mute);line-height:1.3;letter-spacing:-.01em;max-width:100%;text-wrap:balance}
@media (max-width:359px){
  .pow b{font-size:13.5px}
  .pow small{font-size:9.5px}
}
.pow .check{
  position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;display:none;place-items:center;
  background:var(--blood-hot);color:#fff;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.pow .check svg{width:10px;height:10px}
.pow.on{
  color:var(--bone);border-color:rgba(229,38,47,.55);
  background:radial-gradient(120% 110% at 50% 0%,#8E1119 0%,#5C0B12 58%,#3F080D 100%);
  box-shadow:inset 0 0 0 1px rgba(229,38,47,.16),inset 0 1px 0 rgba(255,255,255,.08),0 8px 26px rgba(179,18,31,.3);
}
.pow.on .ico{color:var(--bone)}
.pow.on small{color:rgba(237,228,214,.72)}
.pow.on .check{display:grid}
.pow.on::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(229,38,47,.28),transparent 70%);
  animation:innerPulse 2.6s ease-in-out infinite;
}
.pow[data-id="whisper"].on::after{animation-duration:4s;opacity:.6}
.pow[data-id="anathema"].on{
  box-shadow:inset 0 0 0 1px rgba(255,59,47,.35),inset 0 1px 0 rgba(255,255,255,.08),0 0 28px rgba(255,59,47,.32),0 10px 30px rgba(179,18,31,.28);
  animation:anathemaBreathe var(--dur-breathe) ease-in-out infinite;
}
.pow[data-id="anathema"].on::after{animation-duration:1.2s}
@keyframes innerPulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes anathemaBreathe{
  0%,100%{transform:scale(1);box-shadow:inset 0 0 0 1px rgba(255,59,47,.35),0 0 22px rgba(255,59,47,.24),0 10px 30px rgba(179,18,31,.22)}
  50%{transform:scale(1.025);box-shadow:inset 0 0 0 1px rgba(255,59,47,.55),0 0 38px rgba(255,59,47,.4),0 12px 36px rgba(179,18,31,.3)}
}

/* ---- Без мата toggle ---- */
.toggle-row{
  display:flex;align-items:center;gap:12px;padding:13px 14px 13px 12px;margin:0 0 26px;
  border-radius:var(--r-card);border:1px solid var(--line);
  background:linear-gradient(180deg,#171312,#100D0C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.28);
}
.toggle-ico{
  width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(237,228,214,.06);border:1px solid var(--line);color:var(--bone-dim);
}
.toggle-ico svg{width:18px;height:18px}
.toggle-text{flex:1;min-width:0;text-align:left}
.toggle-text b{display:block;font-size:15px;font-weight:600;color:var(--bone);line-height:1.25}
.toggle-text small{display:block;font-size:11px;color:var(--bone-mute);margin-top:2px;line-height:1.3}
.switch{
  width:51px;height:31px;border-radius:var(--r-pill);flex:none;position:relative;
  background:rgba(237,228,214,.14);transition:background var(--dur),box-shadow var(--dur);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#F4EDE2;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform var(--dur) var(--ease),background var(--dur);
}
.switch[aria-checked="true"]{background:linear-gradient(180deg,#D21B26,#9F0F1A);box-shadow:0 0 18px rgba(179,18,31,.38)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:active{transform:none}

/* ---- CTA pill ---- */
.cta{
  width:100%;min-height:64px;border-radius:var(--r-pill);position:relative;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:400;color:var(--bone);letter-spacing:.005em;
  background:radial-gradient(120% 170% at 50% 0%,#B8141F 0%,#7E0D15 58%,#520810 100%);
  border:1px solid rgba(255,96,96,.5);
  box-shadow:0 0 0 4px rgba(179,18,31,.12),0 0 36px rgba(179,18,31,.45),0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
  margin:0 0 22px;z-index:1;padding:0 56px;
  transition:transform 150ms var(--ease),box-shadow var(--dur),filter var(--dur),opacity var(--dur);
}
.cta::before{
  content:"";position:absolute;inset:-8px;border-radius:var(--r-pill);pointer-events:none;
  box-shadow:0 0 44px 8px rgba(179,18,31,.26);animation:ctaBreathe 3.4s ease-in-out infinite;
}
@keyframes ctaBreathe{0%,100%{opacity:.55}50%{opacity:1}}
.cta .arrow{position:absolute;right:22px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--bone)}
.cta:active:not(:disabled){transform:scale(.985);filter:brightness(1.08)}
.cta:disabled{opacity:.55;cursor:not-allowed}
.cta.busy{opacity:.8}

.footer-line{
  display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 0;
  font-family:var(--serif);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dim);
}
.footer-line::before,.footer-line::after{content:"";height:1px;flex:1;max-width:56px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.footer-line::after{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.footer-line span{white-space:nowrap}

/* ---- Result ---- */
.verdict{display:none;position:relative;z-index:2;margin-top:6px}
.verdict.show{display:block!important;opacity:1!important;visibility:visible!important}
body.is-result .overlay{display:none!important;opacity:0!important;pointer-events:none!important}
.v-eyebrow{
  font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  text-align:center;margin:22px 0 10px;
}
.cursed-name{
  font-family:var(--serif);font-weight:400;font-size:clamp(30px,8.6vw,38px);line-height:1.1;text-align:center;
  color:var(--bone);margin:0 0 12px;word-break:break-word;letter-spacing:-.01em;
}
.meta-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.power-tag{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-pill);
  border:1px solid rgba(229,38,47,.5);color:#F2A7A7;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  background:rgba(179,18,31,.14);box-shadow:0 0 14px rgba(179,18,31,.14);
}
.power-tag[data-power="whisper"]{border-color:rgba(166,90,85,.55);color:#DCAAA4;background:rgba(166,90,85,.12);box-shadow:none}
.power-tag[data-power="anathema"]{border-color:rgba(255,59,47,.65);color:#FFB8AE;background:rgba(255,59,47,.16);box-shadow:0 0 18px rgba(255,59,47,.28)}
.v-frame{
  position:relative;border:1px solid rgba(179,18,31,.5);border-radius:22px;padding:26px 20px 22px;
  background:linear-gradient(180deg,rgba(26,14,13,.94),rgba(12,9,8,.96));
  box-shadow:0 0 44px rgba(179,18,31,.14),0 22px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden;
}
.v-frame::before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,74,.18);border-radius:15px;pointer-events:none;
}
.v-frame::after{
  content:"";position:absolute;left:0;right:0;top:0;height:160px;pointer-events:none;
  background:radial-gradient(ellipse 70% 100% at 50% 0%,rgba(179,18,31,.18),transparent 70%);
}
.stamp-mark{
  width:64px;height:48px;margin:0 auto 14px;display:grid;place-items:center;position:relative;z-index:1;
  opacity:0;transform:scale(2.4) rotate(-12deg);
}
.stamp-mark svg{width:100%;height:100%;display:block}
.block{margin:0 0 14px;text-align:center;position:relative;z-index:1}
.block-label{
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dim);font-weight:600;margin:0 0 6px;
}
.block-label:empty{display:none}
.block.sin-block .block-body{margin:0;font-size:14px;color:var(--bone-dim);font-weight:500;line-height:1.4}
.v-situation{
  margin:-4px 0 16px;font-size:13px;line-height:1.45;color:var(--bone-mute);font-style:italic;text-align:center;
  position:relative;z-index:1;
}
.v-situation[hidden]{display:none}
.block.punch-block{margin-bottom:16px;padding-top:12px;border-top:1px solid rgba(201,162,74,.14)}
.block-setup{margin:0 0 6px;font-size:13px;color:var(--bone-dim);line-height:1.4}
.block-setup[hidden]{display:none}
.block.punch-block .block-body{
  margin:0;font-family:var(--serif);font-size:clamp(20px,5.4vw,23px);line-height:1.38;color:var(--bone);font-weight:400;
  min-height:1.4em;
}
.block.lift{margin-bottom:0;padding-top:12px;border-top:1px solid rgba(201,162,74,.14)}
.block.lift .block-body{margin:0;font-size:14px;color:var(--bone-dim);line-height:1.5;font-weight:500}
.verdict.flash-anathema .v-frame{animation:anaFlash .55s var(--ease)}
@keyframes anaFlash{
  0%{box-shadow:inset 0 0 0 0 transparent}
  18%{box-shadow:inset 0 0 72px rgba(179,18,31,.45),0 0 30px rgba(255,59,47,.3);border-color:rgba(255,59,47,.7)}
  100%{box-shadow:inset 0 0 0 0 transparent}
}
.red-flash{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 80% 70% at 50% 40%,rgba(179,18,31,.45),transparent 70%);
}
.red-flash.on{animation:redFlashBurst .48s ease-out forwards}
@keyframes redFlashBurst{0%{opacity:.85}100%{opacity:0}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions button{
  min-height:48px;border-radius:var(--r-pill);font-weight:600;font-size:14px;letter-spacing:.01em;
  transition:border-color var(--dur),color var(--dur),background var(--dur),box-shadow var(--dur),transform 150ms var(--ease);
}
.actions .btn-primary{
  grid-column:1/-1;min-height:58px;font-family:var(--serif);font-size:19px;font-weight:400;color:var(--bone);
  background:radial-gradient(120% 170% at 50% 0%,#B8141F 0%,#7E0D15 58%,#520810 100%);
  border:1px solid rgba(255,96,96,.45);
  box-shadow:0 0 30px rgba(179,18,31,.38),0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
}
.actions .btn-primary:active{filter:brightness(1.08)}
.actions .btn-secondary{
  background:rgba(237,228,214,.05);border:1px solid var(--line-strong);color:var(--bone);
}
.actions .btn-secondary:active{border-color:rgba(237,228,214,.35)}
.actions .btn-ghost{
  grid-column:1/-1;min-height:44px;background:transparent;color:var(--bone-dim);
  text-decoration:underline;text-decoration-color:rgba(237,228,214,.25);text-underline-offset:5px;
}
.actions .btn-ghost:active,.actions .btn-ghost:hover{color:var(--bone)}
.disclaimer{margin:18px 0 0;text-align:center;font-size:11px;color:var(--bone-mute);line-height:1.5}

/* ---- Ritual overlay ---- */
.overlay{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:22px;background:rgba(7,5,5,.97);padding:24px;opacity:0;
}
.overlay.on{display:flex}
.ritual-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.seal-stage{
  width:168px;height:168px;position:relative;z-index:2;display:grid;place-items:center;
  transform:scale(.92);opacity:.9;
}
.seal-stage[data-power="whisper"]{width:148px;height:148px}
.seal-stage[data-power="seal"]{width:168px;height:168px}
.seal-stage[data-power="anathema"]{width:196px;height:196px}
.seal-stage.svg-fallback{display:grid}
.seal-stage.three-mode{opacity:0;pointer-events:none;position:absolute;width:1px;height:1px;overflow:hidden}
.seal-stage svg{width:100%;height:100%}
.seal-stage .spin{animation:sealSpin 8s linear infinite;transform-origin:center}
@keyframes sealSpin{to{transform:rotate(360deg)}}
.chant{
  position:relative;z-index:2;color:var(--bone);font-family:var(--serif);font-size:clamp(20px,5.2vw,24px);
  text-align:center;min-height:1.5em;max-width:340px;line-height:1.35;font-weight:400;
  text-shadow:0 0 28px rgba(179,18,31,.35);
}
.progress-wrap{position:relative;z-index:2;width:min(240px,65vw);height:2px;background:var(--line);overflow:hidden}
.progress-bar{height:100%;width:0%;background:var(--blood);transition:none}
.progress-wrap.power-whisper .progress-bar{background:var(--ash-rose)}
.progress-wrap.power-seal .progress-bar{background:var(--blood)}
.progress-wrap.power-anathema .progress-bar{background:var(--ember);box-shadow:0 0 12px rgba(255,59,47,.55);animation:progPulse .7s ease-in-out infinite}
@keyframes progPulse{0%,100%{opacity:.7}50%{opacity:1}}
.busy-label{
  position:relative;z-index:2;font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);
}
.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-b));
  transform:translateX(-50%) translateY(12px);opacity:0;z-index:70;
  padding:12px 16px;border-radius:14px;background:rgba(22,15,14,.96);
  border:1px solid rgba(179,18,31,.35);color:var(--bone);font-size:13px;font-weight:600;
  max-width:min(400px,88vw);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);
  transition:opacity var(--dur),transform var(--dur);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.screen-cast.hidden,.screen-result.hidden{display:none}

/* =========================================================
   v19 PRODUCT SHELL — tabs, splash, lists, profile, paywall
   ========================================================= */
.app{padding-bottom:calc(96px + var(--safe-b))}
.toast{bottom:calc(94px + var(--safe-b))}
body.is-casting .toast,body.is-splash .toast{bottom:calc(24px + var(--safe-b))}
.tab{position:relative;z-index:1}
.tab.hidden,.page.hidden{display:none}
body:not([data-tab="ritual"]) .hero-bg,body:not([data-tab="ritual"]) .close-btn{display:none}
.hidden{display:none!important}

/* ---- Bottom nav ---- */
.tabbar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:8px 8px calc(10px + var(--safe-b));
  background:linear-gradient(180deg,rgba(16,11,10,.94),rgba(9,7,6,.985));
  border-top:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 -14px 34px rgba(0,0,0,.5);
}
.tabbar::before{content:"";position:absolute;left:8%;right:8%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(237,228,214,.22),transparent)}
.tab-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:52px;padding:6px 2px 4px;border-radius:14px;color:var(--bone-mute);
  font-size:10px;letter-spacing:.02em;font-weight:600;transition:color var(--dur),background var(--dur);
}
.tab-btn svg{width:22px;height:22px;display:block}
.tab-btn.on{color:var(--blood-hot)}
.tab-btn.on svg{filter:drop-shadow(0 0 8px rgba(229,38,47,.6))}
.tab-btn.on::after{content:"";position:absolute;top:0;left:50%;width:18px;height:2px;border-radius:2px;background:var(--blood-hot);transform:translateX(-50%);box-shadow:0 0 10px rgba(229,38,47,.8)}
.tab-btn:active{transform:none;background:rgba(237,228,214,.04)}
body.is-splash .tabbar,body.is-casting .tabbar{display:none}

/* ---- Splash ---- */
.splash{
  position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--soot-950);cursor:pointer;overflow:hidden;transition:opacity 480ms ease;user-select:none;-webkit-user-select:none;
}
.splash.out{opacity:0;pointer-events:none}
.splash-art{
  position:absolute;inset:0;background:url("hero-altar.jpg") center 28%/cover no-repeat;opacity:.5;filter:saturate(.85) contrast(1.08);
  -webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 40%,#000 25%,transparent 82%);
  mask-image:radial-gradient(ellipse 85% 70% at 50% 40%,#000 25%,transparent 82%);
}
/* v20.2: the portrait altar (assets/splash/altar-9x16.png) fades in over the fallback once app.js has confirmed it loads —
   `html.has-splash-art` is the only thing that references the file, so a missing asset costs no request and leaves the old hero. */
.splash-art-alt{background-image:none;opacity:0;transition:opacity 600ms ease}
html.has-splash-art .splash-art-alt{background-image:url("assets/splash/altar-9x16.png");background-position:center 40%;opacity:.55}
.splash-veil{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 46% at 50% 44%,rgba(179,18,31,.32),transparent 66%),
    linear-gradient(180deg,rgba(7,5,5,.55) 0,rgba(7,5,5,.1) 36%,rgba(7,5,5,.9) 76%,#070505 100%);
}
.splash-sigil{position:relative;width:min(58vw,224px);height:auto;margin:0 0 20px;filter:drop-shadow(0 0 34px rgba(179,18,31,.5))}
.splash-sigil .spin{animation:sealSpin 16s linear infinite;transform-origin:center}
.splash-sigil .spin-r{animation:sealSpin 24s linear infinite reverse;transform-origin:center}
.splash-brand{
  position:relative;font-family:var(--serif);font-size:clamp(30px,9.2vw,38px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone);text-shadow:0 2px 26px rgba(0,0,0,.75);line-height:1;
}
.splash-brand::first-letter{font-size:1.14em}
.splash-tag{position:relative;margin-top:10px;font-family:var(--serif);font-size:11px;line-height:1.6;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-dim);text-align:center;padding:0 24px;max-width:340px;text-wrap:balance}
.splash-prog{position:relative;width:min(220px,60vw);height:2px;background:rgba(237,228,214,.12);margin:40px 0 12px;overflow:hidden}
.splash-prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--blood),var(--ember));box-shadow:0 0 14px rgba(229,38,47,.7)}
.splash-load{position:relative;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-mute);text-align:center;padding:0 24px}
.splash-foot{position:absolute;left:24px;right:24px;bottom:calc(26px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.splash-hint{margin:0;font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.45;color:var(--bone-dim)}
.splash-skip{
  min-height:40px;padding:0 22px;border-radius:var(--r-pill);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--bone);background:rgba(237,228,214,.06);border:1px solid var(--line-strong);position:relative;z-index:1;
}
.splash-skip:active{background:rgba(237,228,214,.12)}

/* ---- Page head / segmented / cards ---- */
.page-head{
  position:relative;z-index:1;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;
  padding:calc(14px + var(--safe-t)) 0 16px;
}
.page-title{
  grid-column:2;margin:0;text-align:center;font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--bone);line-height:1.3;
}
.page-title::first-letter{font-size:1.15em}
.icon-round{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(20,15,13,.78);border:1px solid var(--line-strong);color:var(--bone);
  transition:border-color var(--dur),background var(--dur);
}
.icon-round svg{width:16px;height:16px}
.icon-round:hover{border-color:rgba(237,228,214,.3)}
.page-head .back{grid-column:1}
.page-head .right{grid-column:3}
.page-sub{margin:-6px 0 18px;text-align:center;font-size:12.5px;line-height:1.45;color:var(--bone-mute)}
.seg{
  display:grid;gap:4px;padding:4px;border-radius:var(--r-pill);border:1px solid var(--line);margin:0 0 16px;
  background:linear-gradient(180deg,#151110,#0F0C0B);box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.seg[data-n="2"]{grid-template-columns:1fr 1fr}
.seg[data-n="3"]{grid-template-columns:1fr 1fr 1fr}
.seg button{
  min-height:36px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--bone-dim);border:1px solid transparent;
  transition:background var(--dur),color var(--dur),border-color var(--dur);
}
.seg button.on{background:linear-gradient(180deg,#2C1917,#1B110F);color:var(--bone);border-color:rgba(229,38,47,.38);box-shadow:0 0 14px rgba(179,18,31,.18)}
.card{
  border-radius:var(--r-card);border:1px solid var(--line);
  background:linear-gradient(180deg,#171312,#100D0C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.28);
  transition:border-color var(--dur),box-shadow var(--dur),transform 150ms var(--ease);
}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:var(--r-pill);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;line-height:1;white-space:nowrap}
.tag svg{width:11px;height:11px}
.tag.gold{color:var(--gold-hot);border:1px solid rgba(201,162,74,.45);background:rgba(201,162,74,.1)}
.tag.blood{color:#F2A7A7;border:1px solid rgba(229,38,47,.5);background:rgba(179,18,31,.14)}
.empty{padding:34px 20px 30px;text-align:center;color:var(--bone-mute);font-size:14px;line-height:1.5}
.empty .sig{width:64px;height:48px;margin:0 auto 12px;opacity:.55}
.empty b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.2;color:var(--bone);margin:0 0 6px}
.empty .body{max-width:280px;margin:0 auto}
.empty button{
  margin-top:16px;min-height:44px;padding:0 22px;border-radius:var(--r-pill);
  background:rgba(179,18,31,.14);border:1px solid rgba(229,38,47,.45);color:var(--bone);font-weight:600;font-size:13px;
}
.list{display:flex;flex-direction:column;gap:10px;margin:0 0 20px}
.thumb{
  width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:radial-gradient(120% 110% at 50% 0%,#2A1210,#140D0C);border:1px solid rgba(179,18,31,.35);color:#E39A9A;
}
.thumb svg{width:22px;height:22px}
.thumb[data-power="whisper"]{border-color:rgba(166,90,85,.45);color:#DCAAA4}
.thumb[data-power="anathema"]{border-color:rgba(255,59,47,.6);color:#FFB8AE;box-shadow:0 0 14px rgba(255,59,47,.25)}
.thumb.gold{border-color:rgba(201,162,74,.4);color:var(--gold-hot);background:radial-gradient(120% 110% at 50% 0%,#2A1F10,#140F0C)}
.heart{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--bone-mute);
  transition:color var(--dur),transform 150ms var(--ease);
}
.heart svg{width:18px;height:18px}
.heart.on{color:var(--blood-hot);filter:drop-shadow(0 0 8px rgba(229,38,47,.55))}
.heart.on svg path{fill:currentColor}
.chev{width:30px;height:36px;display:grid;place-items:center;color:var(--bone-mute)}
.chev svg{width:16px;height:16px}

/* ---- Ritual tab: context pills ---- */
.ctx-row{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px;position:relative;z-index:1}
.ctx-row:empty{display:none}
.ctx-pill{
  display:inline-flex;align-items:center;gap:8px;padding:6px 7px 6px 12px;border-radius:var(--r-pill);max-width:100%;
  border:1px solid var(--line-strong);background:rgba(237,228,214,.06);color:var(--bone);font-size:12px;font-weight:600;
}
.ctx-pill.blood{border-color:rgba(229,38,47,.42);background:rgba(179,18,31,.13);color:#F2A7A7}
.ctx-pill small{font-weight:500;opacity:.72;font-size:12px}
.ctx-pill .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(237,228,214,.12);color:var(--bone);flex:none}
.ctx-pill .x svg{width:9px;height:9px}

/* ---- Ritual tab: popular strip («Сейчас жгут») ---- */
.pop-strip{margin:-6px 0 18px;position:relative;z-index:1}
.pop-strip:empty,.pop-strip.hidden{display:none}
.pop-label{font-family:var(--serif);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--bone-mute);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pop-label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blood);opacity:.85;flex:none}
.pop-scroll{
  display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  margin:0 -20px;padding:2px 20px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);
}
.pop-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.pop-chip{
  flex:none;scroll-snap-align:start;min-height:34px;padding:0 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
  color:var(--bone-dim);background:linear-gradient(180deg,#1B1615,#151110);border:1px solid var(--line-strong);white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 4px 12px rgba(0,0,0,.25);transition:color var(--dur),border-color var(--dur),background var(--dur);
}
.pop-chip.on{color:var(--bone);border-color:rgba(229,38,47,.5);background:linear-gradient(180deg,#2C1917,#1B110F)}

/* ---- Categories ---- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.cat-card{
  position:relative;min-height:132px;padding:18px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--bone);overflow:hidden;
}
.cat-card .ico,.cat-pro-card .ico{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:2px;
  background:rgba(237,228,214,.05);border:1px solid var(--line);color:var(--bone-dim);transition:color var(--dur),border-color var(--dur),background var(--dur);
}
.cat-card .ico svg,.cat-pro-card .ico svg{width:20px;height:20px}
.cat-card b,.cat-pro-card b{font-family:var(--serif);font-weight:400;font-size:17px;line-height:1.15}
.cat-card small,.cat-pro-card small{font-size:10.5px;line-height:1.35;color:var(--bone-mute);text-wrap:balance}
.cat-card .check,.cat-pro-card .check{
  position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;display:none;place-items:center;
  background:var(--blood-hot);color:#fff;border:1.5px solid rgba(255,255,255,.35);
}
.cat-card .check svg,.cat-pro-card .check svg{width:10px;height:10px}
.cat-card.on,.cat-pro-card.on{border-color:rgba(229,38,47,.55);box-shadow:inset 0 0 0 1px rgba(229,38,47,.16),0 0 26px rgba(179,18,31,.22)}
.cat-card.on .ico,.cat-pro-card.on .ico{color:var(--bone);border-color:rgba(229,38,47,.45);background:rgba(179,18,31,.2)}
.cat-card.on .check,.cat-pro-card.on .check{display:grid}
.cat-card.on::after,.cat-pro-card.on::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(229,38,47,.2),transparent 70%)}
/* PRO category («Авторские») lives below the 2×4 grid as its own full-width card */
.cat-pro{margin:0 0 20px}
.cat-pro:empty{display:none}
.cat-pro-card{
  position:relative;width:100%;display:flex;flex-direction:row;align-items:center;text-align:left;gap:14px;padding:14px 16px;
  color:var(--bone);overflow:hidden;
}
.cat-pro-card .ico{margin:0;flex:none}
.cat-pro-card .ct{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.cat-pro-card small{text-wrap:auto}
.cat-pro-card .tag{flex:none}
.cat-pro-card .check{top:auto;bottom:8px;right:8px}
.cat-pro-card.locked .ico{border-color:rgba(201,162,74,.35);color:var(--gold-dim)}
.cat-pro-card.locked b{color:var(--bone-dim)}

/* ---- History ---- */
.hist-item{padding:12px;display:grid;grid-template-columns:48px minmax(0,1fr) 34px 30px;gap:10px;align-items:center;text-align:left;color:var(--bone)}
.hist-main{min-width:0;text-align:left;color:inherit}
.hist-punch{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.35;color:var(--bone);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-meta{margin:5px 0 0;font-size:11.5px;color:var(--bone-dim);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-sub{margin:2px 0 0;font-size:11px;color:var(--bone-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:10px;border-top:1px solid var(--line);margin-top:2px}
.hist-actions button{
  min-height:38px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--bone-dim);
  background:rgba(237,228,214,.05);border:1px solid var(--line);
}
.hist-actions button.danger{color:#F2A7A7;border-color:rgba(229,38,47,.3)}
.hist-item[aria-expanded="false"] .hist-actions{display:none}
.hist-item[aria-expanded="true"]{border-color:var(--line-strong)}

/* ---- Rituals ---- */
.rit-featured{
  position:relative;overflow:hidden;padding:20px 18px;margin:0 0 12px;display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:14px;align-items:center;
  text-align:left;color:var(--bone);width:100%;
  background:radial-gradient(120% 140% at 12% 0%,#3D1114 0%,#1B0D0C 52%,#100C0B 100%);border-color:rgba(229,38,47,.38);
}
.rit-featured::before{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--acc-bg,rgba(229,38,47,.32)),transparent 68%);pointer-events:none}
.rit-featured b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.05;display:block}
.rit-featured small{display:block;margin-top:6px;font-size:11.5px;line-height:1.35;color:var(--bone-dim)}
.rit-featured .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rit-featured .clock{width:76px;height:76px;position:relative;z-index:1;color:var(--acc,#A98BC2);filter:drop-shadow(0 0 22px rgba(169,139,194,.55))}
.rit-featured .hint{display:block;margin-top:8px;font-size:10.5px;line-height:1.35;color:var(--bone-mute);font-style:italic}
.rit-featured .rt{min-width:0;text-align:left;color:inherit;position:relative;z-index:1;padding-right:8px}
.rit-featured .heart{position:absolute;top:8px;right:8px;z-index:2}
.rit-featured.on{border-color:var(--blood-hot);box-shadow:0 0 30px rgba(179,18,31,.3)}
.rit-item{padding:12px;display:grid;grid-template-columns:48px minmax(0,1fr) 34px 30px;gap:10px;align-items:center;text-align:left;color:var(--bone);width:100%}
.rit-item .rt{min-width:0;text-align:left;color:inherit}
.rit-item b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.rit-item small{display:block;font-size:11px;color:var(--bone-mute);margin-top:3px;line-height:1.3}
.rit-item .hint{display:block;font-size:10px;color:var(--bone-mute);opacity:.8;margin-top:4px;line-height:1.3;font-style:italic}
.rit-item .tags{display:flex;gap:6px;margin-top:6px}
.thumb.acc{color:var(--acc);border-color:var(--acc-line);background:radial-gradient(120% 110% at 50% 0%,var(--acc-bg),#140D0C)}
.rit-item.on{border-color:rgba(229,38,47,.55);box-shadow:0 0 22px rgba(179,18,31,.18)}
.rit-item.on .chev{color:var(--blood-hot)}
.rit-item.locked .thumb{border-color:rgba(201,162,74,.35);color:var(--gold-dim)}
.rit-item.locked .chev{color:var(--gold-dim)}

/* ---- Profile ---- */
.prof-head{text-align:center;padding:4px 0 18px;position:relative;z-index:1}
.avatar{
  width:96px;height:96px;margin:0 auto 12px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 50% 0%,#2C1614,#120D0C);border:1px solid rgba(237,228,214,.2);
  box-shadow:0 0 30px rgba(179,18,31,.22),inset 0 1px 0 rgba(255,255,255,.05);transition:border-color var(--dur),box-shadow var(--dur);
}
.avatar svg.hood{width:54px;height:54px;color:var(--bone-dim)}
.avatar .crown-badge{
  position:absolute;top:-8px;right:-6px;width:32px;height:32px;border-radius:50%;background:#0B0908;
  border:1px solid rgba(201,162,74,.55);display:none;place-items:center;box-shadow:0 0 14px rgba(201,162,74,.35);
}
.avatar .crown-badge svg{width:17px;height:13px}
body.is-pro .avatar .crown-badge{display:grid}
/* v20.2 preset avatar: the PNG covers the circle (object-fit cover, 50% radius); until it loads — and if it is missing — the SVG hood stays.
   The gold ring is PRO-only (body.is-pro comes from the local demo flag); everyone else keeps the thin bone line. */
.avatar{overflow:visible;color:var(--bone-dim);cursor:pointer}
.avatar:active:not(:disabled){transform:scale(.98)}
.avatar .avatar-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;opacity:0;transition:opacity 320ms ease}
.avatar.has-img .avatar-img{opacity:1}
.avatar.has-img svg.hood{opacity:0}
.avatar .avatar-edit{
  position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:#0B0908;border:1px solid var(--line-strong);color:var(--bone-dim);box-shadow:0 4px 12px rgba(0,0,0,.45);
}
.avatar .avatar-edit svg{width:12px;height:12px}
.avatar[aria-expanded="true"] .avatar-edit{border-color:rgba(229,38,47,.55);color:#F2A7A7}
body.is-pro .avatar{border-color:var(--gold);box-shadow:0 0 0 2px #0B0908,0 0 0 4px var(--gold),0 0 36px rgba(201,162,74,.3)}
body.is-pro .avatar .avatar-edit{border-color:rgba(201,162,74,.5)}
/* picker: four circular presets under the avatar; the chosen one wears the blood ring */
.avatar-picker{margin:-2px 0 14px}
.avatar-picker[hidden]{display:none}
.av-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.av-opt{
  width:56px;height:56px;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--bone-dim);
  background:radial-gradient(120% 120% at 50% 0%,#2C1614,#120D0C);border:1px solid var(--line-strong);
  transition:border-color var(--dur),box-shadow var(--dur),transform 150ms var(--ease);
}
.av-opt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:0;transition:opacity 320ms ease}
.av-opt.has-img img{opacity:1}
.av-opt svg{width:24px;height:24px;position:relative;transition:opacity 200ms}
.av-opt.has-img svg{opacity:0}
.av-opt.on{border-color:var(--blood-hot);box-shadow:0 0 0 2px rgba(229,38,47,.55),0 0 18px rgba(179,18,31,.4)}
.av-opt:focus-visible{outline-offset:2px}
.av-name{display:block;margin:10px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-mute)}
.av-name:empty{display:none}
/* install tip (A2HS): one quiet card at the end of the profile, never a banner */
.install-tip{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 10px 12px 12px;margin:12px 0 0;color:var(--bone)}
.install-tip .toggle-text b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.install-tip .toggle-text small{display:block;font-size:11px;color:var(--bone-mute);margin-top:3px;line-height:1.35;text-wrap:pretty}
.install-tip .it-actions{display:flex;align-items:center;gap:6px}
.install-tip .it-go{min-height:34px;padding:0 14px;border-radius:var(--r-pill);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--bone);background:rgba(237,228,214,.07);border:1px solid var(--line-strong)}
.install-tip .it-go:active{background:rgba(237,228,214,.14)}
.install-tip .it-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--bone-mute)}
.install-tip .it-x svg{width:14px;height:14px}
.nick-row{display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;flex-wrap:wrap}
.nick{font-family:var(--serif);font-size:24px;line-height:1.15;color:var(--bone);margin:0;word-break:break-word;font-weight:400}
.nick-edit-btn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--bone-mute);background:rgba(237,228,214,.06);border:1px solid var(--line)}
.nick-edit-btn svg{width:13px;height:13px}
.nick-form{display:none;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:10px 0 0}
.nick-form.on{display:grid}
.nick-form input{
  width:100%;min-height:46px;font-size:16px;color:var(--bone);background:linear-gradient(180deg,#1B1615,#151110);
  border:1px solid var(--line-strong);border-radius:14px;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none;
}
.nick-form input:focus{border-color:rgba(229,38,47,.55)}
.nick-form button{min-height:46px;padding:0 16px;border-radius:14px;background:linear-gradient(180deg,#D21B26,#9F0F1A);color:#fff;font-weight:600;font-size:14px}
.since{margin:8px 0 0;font-size:12px;color:var(--bone-mute);display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.counter-card{padding:14px 6px 12px;text-align:center}
.counter-card b{display:block;font-family:var(--serif);font-size:24px;line-height:1;color:var(--bone);font-weight:400}
.counter-card small{display:block;margin-top:7px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-mute);line-height:1.3}
.worse{padding:14px 16px;margin:0 0 12px;display:flex;flex-direction:column;gap:9px}
.worse-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;line-height:1.4;color:var(--bone-dim)}
.worse-label b{color:var(--blood-hot);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.worse-bar{height:6px;border-radius:3px;background:rgba(237,228,214,.08);overflow:hidden}
.worse-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blood-deep),var(--blood-hot));box-shadow:0 0 10px rgba(229,38,47,.55);transition:width 600ms var(--ease)}
.pro-banner{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;margin:0 0 12px;width:100%;
  border:1px solid rgba(201,162,74,.45);border-radius:var(--r-card);text-align:left;color:var(--bone);
  background:linear-gradient(90deg,rgba(201,162,74,.16),rgba(201,162,74,.04));box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.pro-banner .crown{width:28px;height:21px}
.pro-banner b{display:block;font-size:14px;line-height:1.2}
.pro-banner small{display:block;font-size:11px;color:var(--bone-dim);margin-top:2px}
.pro-banner .go{padding:9px 13px;border-radius:var(--r-pill);background:linear-gradient(180deg,#E6C77A,#B08A38);color:#1A130A;font-size:12px;font-weight:700;white-space:nowrap}
.menu{display:flex;flex-direction:column;overflow:hidden;margin:0 0 20px;padding:0}
.menu-item{
  display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;gap:12px;align-items:center;min-height:56px;padding:8px 14px;width:100%;
  text-align:left;color:var(--bone);font-size:15px;font-weight:500;border-top:1px solid var(--line);
}
.menu-item:first-child{border-top:0}
.menu-item:active{background:rgba(237,228,214,.03);transform:none}
.menu-item .mi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(237,228,214,.05);border:1px solid var(--line);color:var(--bone-dim)}
.menu-item .mi svg{width:17px;height:17px}
.menu-item .val{font-size:12px;color:var(--bone-mute);white-space:nowrap}
.menu-item .val.gold{color:var(--gold-hot)}
.menu-item .chev{width:16px;height:16px}
.menu-item .chev svg{width:14px;height:14px}

/* ---- Badges ---- */
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 20px}
.badge{padding:16px 12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.badge .bi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(237,228,214,.04);border:1px solid var(--line);color:var(--bone-mute)}
.badge .bi svg{width:20px;height:20px}
.badge b{font-size:12px;font-weight:600;line-height:1.2;color:var(--bone-dim)}
.badge small{font-size:10px;line-height:1.3;color:var(--bone-mute)}
.badge.on .bi{color:var(--bone);border-color:rgba(229,38,47,.55);background:rgba(179,18,31,.16);box-shadow:0 0 18px rgba(179,18,31,.35)}
.badge.on[data-id="legend-local"] .bi{color:var(--gold-hot)}  /* the PRO badge keeps its gold crown */
.badge.on b{color:var(--bone)}
.badge .lock{position:absolute;top:8px;right:8px;width:13px;height:13px;color:var(--bone-mute);opacity:.7}
.badge.on .lock{display:none}

/* ---- Stats ---- */
.stat-hero{padding:22px 18px 18px;text-align:center;margin:0 0 12px;position:relative;overflow:hidden}
.stat-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(179,18,31,.16),transparent 70%)}
.eyebrow{font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-mute)}
.stat-hero .big{font-family:var(--serif);font-size:clamp(34px,10vw,44px);line-height:1;color:var(--bone);margin:8px 0 6px;position:relative;z-index:1}
.stat-hero .big b{color:var(--blood-hot);font-weight:400}
.stat-hero .sentence{position:relative;z-index:1;margin:0 auto;max-width:300px;font-size:13px;line-height:1.45;color:var(--bone-dim)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin:18px 0 6px;position:relative;z-index:1}
.bars i{display:block;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--blood-hot),var(--blood-deep));min-height:3px;box-shadow:0 0 10px rgba(229,38,47,.3)}
.bars i.zero{background:rgba(237,228,214,.08);box-shadow:none}
.bars-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-mute);text-align:center;position:relative;z-index:1}
.bars-cap{margin:10px 0 0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-mute)}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.stat-card{padding:14px}
.stat-card b{display:block;font-family:var(--serif);font-size:26px;color:var(--bone);line-height:1;font-weight:400}
.stat-card small{display:block;margin-top:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-mute)}
.pbars{padding:14px 16px;margin:0 0 12px;display:flex;flex-direction:column;gap:10px}
.pbars .group-label{margin:0 0 2px}
.pbar{display:grid;grid-template-columns:118px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:12.5px;color:var(--bone-dim)}
.pbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .track{height:6px;border-radius:3px;background:rgba(237,228,214,.08);overflow:hidden}
.pbar .track i{display:block;height:100%;border-radius:3px;background:var(--bar,var(--blood))}
.pbar em{font-style:normal;text-align:right;color:var(--bone);font-variant-numeric:tabular-nums}

/* ---- Paywall ---- */
.pay-hero{
  position:relative;text-align:center;padding:30px 16px 24px;margin:0 0 16px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#33200D 0%,#17110C 52%,#0F0C0B 100%);border-color:rgba(201,162,74,.42);
}
.pay-hero::before{
  content:"";position:absolute;left:50%;top:-60%;width:170%;aspect-ratio:1;transform:translateX(-50%);pointer-events:none;opacity:.55;
  background:repeating-conic-gradient(from 0deg,rgba(201,162,74,.09) 0 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%);mask-image:radial-gradient(circle,#000 0,transparent 60%);
  animation:sealSpin 90s linear infinite;
}
.pay-hero .crown-big{position:relative;width:94px;height:72px;filter:drop-shadow(0 0 28px rgba(201,162,74,.6))}
.pay-title{position:relative;font-family:var(--serif);font-size:clamp(22px,6.6vw,26px);letter-spacing:.14em;text-transform:uppercase;color:var(--bone);margin:12px 0 0;line-height:1.1;font-weight:400}
.pay-title small{display:block;font-size:11px;letter-spacing:.24em;color:var(--gold);margin-top:8px;text-transform:none;font-family:var(--font);font-weight:600}
.perks{display:flex;flex-direction:column;margin:0 0 18px;overflow:hidden}
.perk{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--bone);line-height:1.35}
.perk:first-child{border-top:0}
.perk .pi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hot);background:rgba(201,162,74,.1);border:1px solid rgba(201,162,74,.35)}
.perk .pi svg{width:17px;height:17px}
.cta-gold{
  width:100%;min-height:60px;border-radius:var(--r-pill);font-family:var(--serif);font-size:21px;color:#1A130A;position:relative;
  background:radial-gradient(120% 170% at 50% 0%,#F2DB94 0%,#C9A24A 55%,#8F7538 100%);border:1px solid rgba(255,235,180,.6);
  box-shadow:0 0 36px rgba(201,162,74,.4),0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);margin:0 0 10px;
  transition:filter var(--dur),opacity var(--dur);
}
.cta-gold:active:not(:disabled){filter:brightness(1.06)}
.cta-gold:disabled{cursor:default;filter:saturate(.6);opacity:.92}
.link-btn{display:block;width:100%;text-align:center;color:var(--bone-dim);font-size:13px;text-decoration:underline;text-decoration-color:rgba(237,228,214,.25);text-underline-offset:4px;padding:8px}
.fine{margin:12px 0 22px;text-align:center;font-size:11px;color:var(--bone-mute);line-height:1.55}

/* ---- Leaderboard ---- */
.lb-head{display:flex;justify-content:flex-end;padding:0 14px 6px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-mute);font-weight:600}
.lb{display:flex;flex-direction:column;overflow:hidden;margin:0 0 12px}
.lb-row{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--bone)}
.lb-row:first-child{border-top:0}
.lb-row .rank{font-family:var(--serif);color:var(--bone-mute);text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.lb-row.top .rank{color:var(--bone)}
.lb-row.top1 .rank{color:var(--gold-hot)}
.lb-row .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(237,228,214,.06);border:1px solid var(--line);font-family:var(--serif);font-size:15px;color:var(--bone-dim)}
.lb-row .nm{min-width:0;display:flex;align-items:center;gap:6px}
.lb-row .nm > span:first-child{min-width:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lb-row .nm svg{width:16px;height:12px;flex:none}
.lb-row .nm .you{font-size:11px;color:var(--bone-mute);flex:none}
.lb-row .kv{font-variant-numeric:tabular-nums;color:var(--bone-dim);font-weight:600;font-size:13px;white-space:nowrap}
.lb-row.me{background:linear-gradient(90deg,rgba(179,18,31,.2),rgba(179,18,31,.04))}
.lb-row.me .av{border-color:rgba(229,38,47,.5);color:var(--bone)}
.lb-row.me .kv{color:#F2A7A7}

/* ---- Settings / about ---- */
.group-label{margin:4px 0 8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-mute);font-weight:600}
.settings .toggle-row{margin:0 0 10px}
.settings .group{margin:0 0 18px}
.btn-row{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px 12px 12px;margin:0 0 10px;text-align:left;color:var(--bone)}
.btn-row .toggle-text b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.btn-row .toggle-text small{display:block;font-size:11px;color:var(--bone-mute);margin-top:2px;line-height:1.3}
.btn-row.danger{border-color:rgba(229,38,47,.3)}
.btn-row.danger .toggle-text b{color:#F2A7A7}
.btn-row.danger .toggle-ico{color:#F2A7A7;border-color:rgba(229,38,47,.3)}
.btn-row.armed{border-color:var(--blood-hot);background:linear-gradient(180deg,#3A0F14,#1E0A0D);box-shadow:0 0 22px rgba(179,18,31,.3)}
.switch[aria-disabled="true"]{opacity:.55;cursor:default}
.about-brand{text-align:center;padding:8px 0 4px}
.about-brand .crown{width:36px;height:27px;display:block;margin:0 auto 8px;filter:drop-shadow(0 0 10px rgba(201,162,74,.4))}
.about-brand .brand-name{font-size:20px}
.about-brand .ver{margin-top:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-mute)}
.about-lines{padding:6px 16px;margin:14px 0 12px}
.about-lines p{margin:0;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--bone-dim)}
.about-lines p:first-child{border-top:0}
.about-lines p b{color:var(--bone);font-weight:600}

/* ---- Result: fav + harder + ritual line ---- */
.action-icons{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions .icon-btn{
  min-height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 6px;min-width:0;
  background:rgba(237,228,214,.05);border:1px solid var(--line-strong);color:var(--bone-dim);font-size:10.5px;font-weight:600;letter-spacing:0;
  transition:color var(--dur),border-color var(--dur),background var(--dur),transform 150ms var(--ease);
}
.actions .icon-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions .icon-btn svg{width:20px;height:20px}
.actions .icon-btn.on{color:var(--blood-hot);border-color:rgba(229,38,47,.5);background:rgba(179,18,31,.12)}
.actions .icon-btn.on svg path{fill:currentColor}
.actions .btn-primary .flame{width:20px;height:20px;margin-right:8px;vertical-align:-3px}
.block.ritual-line{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(237,228,214,.12)}
.block.ritual-line[hidden]{display:none}
.rl{display:inline-flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--bone);line-height:1.4;text-align:left;max-width:100%}
.rl svg{width:16px;height:16px;flex:none;margin-top:2px}
.rl b{font-weight:600;color:var(--bone)}
.rl span{color:var(--bone-dim)}

/* =========================================================
   v20 PRODUCTION — intro gate, legal pages, what's new, data tools
   ========================================================= */
/* ---- Intro (first launch): below the toast (70), above the app; the splash (80) reveals it as it fades ---- */
.intro{
  position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + var(--safe-t)) 16px calc(18px + var(--safe-b));background:var(--soot-950);overflow:auto;
}
.intro.hidden{display:none!important}
/* v20.2: full-bleed altar behind the gate — the hero-altar.jpg fallback by default, the portrait 9:16 once it is known to load.
   Sits under the veil and the card; the card keeps its near-opaque body, so Freya's copy is untouched and stays legible. */
.intro-art{
  position:fixed;inset:0;pointer-events:none;background:url("hero-altar.jpg") center 100%/auto 170% no-repeat;opacity:.62;filter:saturate(.85) contrast(1.06);
  -webkit-mask-image:radial-gradient(ellipse 100% 90% at 50% 35%,#000 20%,transparent 92%);
  mask-image:radial-gradient(ellipse 100% 90% at 50% 35%,#000 20%,transparent 92%);
}
/* the altar is enlarged (170% of the viewport height) and pinned to the bottom, so the crown and the rune circle rise above the card
   instead of hiding behind it — the gate reads as a document lying on the altar; the same framing suits the 9:16 asset */
html.has-splash-art .intro-art{background-image:url("assets/splash/altar-9x16.png")}
.intro-veil{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 48% at 50% 18%,rgba(179,18,31,.30),transparent 66%),
    radial-gradient(ellipse 100% 60% at 50% 104%,rgba(0,0,0,.6),transparent 70%),
    linear-gradient(180deg,rgba(7,5,5,.35) 0,rgba(7,5,5,.1) 40%,rgba(7,5,5,.55) 100%);
}
.intro-card{
  position:relative;width:100%;max-width:400px;text-align:center;padding:24px 20px 18px;border-radius:26px;
  border:1px solid rgba(179,18,31,.42);background:linear-gradient(180deg,rgba(26,14,13,.96),rgba(12,9,8,.98));
  box-shadow:0 0 44px rgba(179,18,31,.14),0 22px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
}
.intro-card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,74,.16);border-radius:19px;pointer-events:none}
.intro-brand{
  display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;
  font-family:var(--serif);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
}
.intro-brand svg{width:20px;height:15px;filter:drop-shadow(0 0 6px rgba(201,162,74,.35))}
.intro-dots{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
.intro-dots i{display:block;width:22px;height:3px;border-radius:2px;background:rgba(237,228,214,.14);transition:background var(--dur),width var(--dur) var(--ease)}
.intro-dots i.done{background:rgba(201,162,74,.6)}
.intro-dots i.on{width:34px;background:var(--blood-hot);box-shadow:0 0 10px rgba(229,38,47,.7)}
.intro-eyebrow{font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-mute);margin:0 0 14px}
.intro-ico{
  width:66px;height:66px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  background:rgba(179,18,31,.12);border:1px solid rgba(229,38,47,.4);color:#F2A7A7;box-shadow:0 0 22px rgba(179,18,31,.25);
}
.intro-ico svg{width:30px;height:30px}
.intro-ico.age{color:var(--gold-hot);border-color:rgba(201,162,74,.5);background:rgba(201,162,74,.1);box-shadow:0 0 22px rgba(201,162,74,.22)}
.intro-title{
  font-family:var(--serif);font-weight:400;font-size:clamp(28px,8vw,34px);line-height:1.1;color:var(--bone);margin:0 0 12px;letter-spacing:-.01em;
}
.intro-body{margin:0 auto;max-width:320px;font-size:15px;line-height:1.5;color:var(--bone-dim);text-wrap:pretty}
.intro-body:empty{display:none}
/* rules step: the four «play evil, do no evil» bullets, left-aligned under the lead sentence */
.intro-list{margin:12px auto 0;max-width:320px;padding:0;list-style:none;text-align:left}
.intro-list:empty{display:none}
.intro-list li{position:relative;padding:6px 0 6px 18px;font-size:13.5px;line-height:1.45;color:var(--bone-dim);text-wrap:pretty}
.intro-list li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px rgba(229,38,47,.5)}
.intro-note{margin:12px auto 0;max-width:320px;font-size:12px;line-height:1.45;color:var(--bone-mute)}
.intro-note:empty{display:none}
/* age step: the consent statement of each option sits right above its button (canon optionA/optionB.label) */
.intro-opt{margin:18px auto 0;max-width:320px;font-size:12.5px;line-height:1.45;color:var(--bone-dim);text-wrap:pretty}
.intro-opt:empty{display:none}
.intro-cta{margin:22px 0 10px;min-height:58px;font-size:20px;padding:0 52px}
.intro-opt:not(:empty) + .intro-cta{margin-top:10px;font-size:19px}
.intro-opt:not(:empty) + .intro-alt{margin-top:10px}
.intro-cta .arrow{right:20px}
.intro-alt{
  width:100%;min-height:48px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--bone);
  background:rgba(237,228,214,.05);border:1px solid var(--line-strong);margin:0 0 4px;
}
.intro-alt:active{border-color:rgba(237,228,214,.35)}
.intro-alt:empty{display:none}
.intro-under{margin:0;padding:10px;min-height:40px;font-size:12.5px}
.intro-under:empty{display:none}
body.is-intro{overflow:hidden}
body.is-intro .tabbar{display:none}
.switch[aria-disabled="true"]::after{background:#B9B0A4}

/* ---- Legal pages ---- */
.legal .about-lines p{display:block}
.legal .about-lines p b{display:block;margin:0 0 3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.legal .fine{text-align:left;padding:0 4px}
.legal .link-btn{margin:0 0 8px}
.contact{padding:6px 16px;margin:0 0 12px}
.contact p{margin:0;padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13.5px;line-height:1.45;color:var(--bone)}
.contact p:first-child{border-top:0}
.contact p b{color:var(--bone-mute);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;flex:none;padding-top:2px}
.contact p span{text-align:right;min-width:0;overflow-wrap:break-word}
.contact a{color:var(--bone);text-decoration:underline;text-decoration-color:rgba(237,228,214,.3);text-underline-offset:3px}
/* 149-ФЗ requisites: visibly a placeholder until approved — dashed gold frame, muted «ожидается» rows */
.contact.requisites{border:1px dashed rgba(201,162,74,.45);background:linear-gradient(180deg,rgba(201,162,74,.07),rgba(201,162,74,.02))}
.req-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px;border-bottom:1px solid rgba(201,162,74,.22)}
.req-head b{font-family:var(--serif);font-weight:400;font-size:15px;line-height:1.25;color:var(--gold-hot);letter-spacing:.01em}
.req-head .tag{flex:none}
.contact p.pending span{color:var(--bone-mute);font-style:italic}
.contact .req-note{display:block;padding:8px 0 10px;border-top:0;font-size:11.5px;line-height:1.45;color:var(--gold-dim);text-align:left}
.contact .req-note + p{border-top:1px solid rgba(201,162,74,.22)}
.draft-note{margin:0 0 12px;padding:10px 14px;border-radius:14px;border:1px dashed rgba(201,162,74,.4);background:rgba(201,162,74,.06);font-size:12px;line-height:1.45;color:var(--gold-hot);text-align:center}

/* ---- About: what's new ---- */
.whatsnew{padding:14px 16px 12px;margin:0 0 12px}
.whatsnew .group-label{margin:0 0 8px}
.whatsnew ul{margin:0;padding:0;list-style:none}
.whatsnew li{position:relative;padding:8px 0 8px 18px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--bone-dim)}
.whatsnew li:first-child{border-top:0}
.whatsnew li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px rgba(229,38,47,.5)}
.about-publisher{margin:0 0 6px;text-align:center;font-size:11px;letter-spacing:.06em;color:var(--bone-mute)}

/* ---- Settings: data tools ---- */
.btn-row.gold .toggle-ico{color:var(--gold-hot);border-color:rgba(201,162,74,.35)}
.btn-row:disabled{opacity:.55;cursor:default}

@media(prefers-reduced-motion:reduce){
  .splash-sigil .spin,.splash-sigil .spin-r,.pay-hero::before{animation:none!important}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .seal-stage .spin{animation:none!important}
  .pow[data-id="anathema"].on,.pow.on::after{animation:none!important;transform:none!important}
  .progress-wrap.power-anathema .progress-bar{animation:none!important}
  .cta::before{animation:none!important;opacity:.8}
  .control.pulse-inner input,.control.pulse-inner textarea{box-shadow:0 0 0 3px rgba(229,38,47,.3);border-color:var(--blood-hot)}
  .overlay.on{opacity:1}
  button:active:not(:disabled){transform:none}
  .hero-bg img{transition:none}
}
</style>
</head>
<body id="root" data-tab="ritual">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="app">
  <div class="hero-bg" id="heroBg" aria-hidden="true">
    <img id="heroImg" src="hero-altar.jpg" alt="" decoding="async" fetchpriority="high"/>
    <div class="hero-fallback">
      <svg viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hfGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B3121F" stop-opacity=".45"/><stop offset="1" stop-color="#B3121F" stop-opacity="0"/></radialGradient>
          <linearGradient id="hfStone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241D1A"/><stop offset="1" stop-color="#0E0B0A"/></linearGradient>
          <linearGradient id="hfGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9CF86"/><stop offset="1" stop-color="#9C7A2E"/></linearGradient>
          <filter id="hfBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
        </defs>
        <ellipse cx="200" cy="118" rx="196" ry="86" fill="url(#hfGlow)"/>
        <ellipse cx="200" cy="112" rx="160" ry="62" fill="url(#hfStone)" stroke="rgba(237,228,214,.08)"/>
        <ellipse cx="200" cy="112" rx="142" ry="54" stroke="#D6202B" stroke-width="2.2" opacity=".9" filter="url(#hfBlur)"/>
        <ellipse cx="200" cy="112" rx="142" ry="54" stroke="#FF5A4F" stroke-width=".9" opacity=".85"/>
        <ellipse cx="200" cy="112" rx="110" ry="41" stroke="#D6202B" stroke-width="1.6" opacity=".8" filter="url(#hfBlur)"/>
        <ellipse cx="200" cy="112" rx="110" ry="41" stroke="#FF5A4F" stroke-width=".8" opacity=".75"/>
        <ellipse cx="200" cy="112" rx="72" ry="27" stroke="#D6202B" stroke-width="1.4" opacity=".75" filter="url(#hfBlur)"/>
        <ellipse cx="200" cy="112" rx="72" ry="27" stroke="#FF5A4F" stroke-width=".7" opacity=".7"/>
        <g stroke="#FF5A4F" stroke-width="1" opacity=".55">
          <path d="M200 63v6M200 155v6M58 112h6M336 112h6M100 78l3 3M300 78l-3 3M100 146l3-3M300 146l-3-3"/>
        </g>
        <g transform="translate(200 104)">
          <path d="M-22 10 -17-6l8 7L0-12l9 13 8-7 5 16Z" fill="url(#hfGold)"/>
          <rect x="-22" y="11.5" width="44" height="3.6" rx="1.4" fill="url(#hfGold)"/>
        </g>
      </svg>
    </div>
    <div class="hero-shade"></div>
  </div>

  <button type="button" class="close-btn" id="resetBtn" aria-label="Сбросить ритуал">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>

  <section class="tab" data-tab="ritual" id="tabRitual">
  <header class="head">
    <div class="brand">
      <svg class="crown" viewBox="0 0 32 24" aria-hidden="true">
        <defs><linearGradient id="gq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9CF86"/><stop offset="1" stop-color="#9C7A2E"/></linearGradient></defs>
        <path d="M3 19 5.4 7.2l6.1 5.3L16 3l4.5 9.5 6.1-5.3L29 19Z" fill="url(#gq)"/>
        <rect x="3" y="20" width="26" height="2.6" rx="1" fill="url(#gq)"/>
        <circle cx="16" cy="3" r="1.5" fill="#F2DE9C"/><circle cx="5.4" cy="7.2" r="1.2" fill="#F2DE9C"/><circle cx="26.6" cy="7.2" r="1.2" fill="#F2DE9C"/>
      </svg>
      <div class="brand-name">Проклинатор</div>
      <div class="tagline" id="tagline"></div>
    </div>
  </header>

  <section class="screen-cast" id="castScreen">
    <h1 class="title" id="title"></h1>
    <p class="sub" id="subhead"></p>
    <div class="altar-space" aria-hidden="true"></div>

    <div class="ctx-row" id="ctxRow"></div>

    <div class="field">
      <label class="field-label" for="who" id="whoLabel"></label>
      <div class="control single" id="whoCtl">
        <input id="who" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" required aria-required="true" aria-describedby="emptyHint"/>
        <button type="button" class="clear-btn" data-clear="who" aria-label="Очистить поле">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <span class="counter" id="whoCount" aria-hidden="true">0/60</span>
      <span class="empty-hint" id="emptyHint" role="alert"></span>
    </div>

    <div class="field">
      <label class="field-label" for="what" id="whatLabel"></label>
      <div class="control" id="whatCtl">
        <textarea id="what" maxlength="200" rows="3" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></textarea>
        <button type="button" class="clear-btn" data-clear="what" aria-label="Очистить поле">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <span class="counter" id="whatCount" aria-hidden="true">0/200</span>
    </div>

    <div class="pop-strip" id="popStrip">
      <div class="pop-label" id="popLabel"></div>
      <div class="pop-scroll" id="popChips" role="group"></div>
