<style>
:root{
  --soot-950:#070505;
  --soot:#0B0908;
  --soot-800:#120E0D;
  --soot-700:#19140F;
  --soot-600:#221B17;
  --bone:#EDE4D6;
  --bone-dim:#A99E90;
  --bone-mute:#6E655B;
  --line:rgba(237,228,214,0.08);
  --line-strong:rgba(237,228,214,0.16);
  --blood:#B3121F;
  --blood-deep:#5E0A10;
  --blood-hot:#E5262F;
  --blood-dim:rgba(179,18,31,0.18);
  --blood-glow:rgba(179,18,31,0.45);
  --ember:#FF3B2F;
  --ash-rose:#A65A55;
  --gold:#C9A24A;
  --gold-hot:#E6C77A;
  --gold-dim:#8F7538;
  --gold-soft:rgba(201,162,74,0.28);
  --ink:#0B0908;

  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Playfair Display","Cormorant Garamond",Didot,"Bodoni 72","Times New Roman",Georgia,serif;

  --r-ctrl:16px;
  --r-card:18px;
  --r-pill:999px;
  --ease:cubic-bezier(0.32,0.72,0,1);
  --dur:200ms;
  --dur-breathe:2.3s;
  --accent:var(--blood);

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* hero geometry: header stack sits on the dark top of the altar image */
  --hero-h:calc(clamp(400px,128vw,540px) + var(--safe-t));
  --head-h:calc(186px + var(--safe-t));

  font-family:var(--font);
}
html[data-power="whisper"]{--accent:var(--ash-rose)}
html[data-power="seal"]{--accent:var(--blood)}
html[data-power="anathema"]{--accent:var(--ember)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
html,body{overflow-x:hidden;margin:0;min-height:100%;min-height:100dvh;background:var(--soot);color:var(--bone)}
body{
  overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:0 var(--safe-r) 0 var(--safe-l);
  background:
    radial-gradient(ellipse 90% 46% at 50% 14%,rgba(120,12,20,.22),transparent 62%),
    radial-gradient(ellipse 80% 40% at 50% 108%,rgba(0,0,0,.75),transparent 60%),
    linear-gradient(180deg,#0D0A09 0%,var(--soot) 40%,var(--soot-950) 100%);
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;mix-blend-mode:overlay;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:89;
  background:radial-gradient(ellipse 78% 72% at 50% 46%,transparent 42%,rgba(7,5,5,.66) 100%);
}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blood-hot);outline-offset:3px}
button:active:not(:disabled){transform:scale(.97);transition:transform 150ms var(--ease)}

.app{
  max-width:430px;margin:0 auto;min-height:100dvh;
  padding:0 20px calc(28px + var(--safe-b));
  position:relative;z-index:1;
}

/* ---- Hero altar (cinematic image, fades into soot) ---- */
.hero-bg{
  position:absolute;left:0;right:0;top:0;height:var(--hero-h);z-index:0;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%);
  mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%);
}
@media (min-width:480px){
  /* wide viewports: also feather the column edges so the image melts into the page background */
  .hero-bg{
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%),linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to bottom,#000 0,#000 58%,transparent 80%),linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%);
    mask-composite:intersect;
  }
}
.hero-bg img{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:cover;object-position:50% 100%;opacity:0;transition:opacity 700ms ease;
}
.hero-bg.ready img{opacity:1}
.hero-bg.no-img img{display:none}
.hero-shade{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(11,9,8,.62) 0,rgba(11,9,8,.22) 20%,transparent 38%);
}
.hero-fallback{
  position:absolute;left:0;right:0;top:calc(var(--head-h) - 4px);height:calc(var(--hero-h) - var(--head-h) - 40px);
  display:none;place-items:center;
}
.hero-bg.no-img .hero-fallback{display:grid}
.hero-fallback svg{width:100%;height:100%;max-height:220px}
body.is-result .hero-bg{display:none}

/* ---- Header / brand ---- */
.close-btn{
  position:absolute;top:calc(14px + var(--safe-t));right:20px;z-index:4;
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(20,15,13,.78);border:1px solid var(--line-strong);color:var(--bone);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color var(--dur),background var(--dur);
}
.close-btn svg{width:16px;height:16px}
.close-btn:hover{border-color:rgba(237,228,214,.3);background:rgba(28,20,18,.9)}
.head{position:relative;z-index:1;text-align:center;padding-top:calc(14px + var(--safe-t))}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px}
.brand .crown{width:28px;height:21px;display:block;filter:drop-shadow(0 0 8px rgba(201,162,74,.35))}
.brand-name{
  font-family:var(--serif);font-size:17px;line-height:1.2;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone);font-weight:400;
}
.brand-name::first-letter{font-size:1.18em}
.tagline{
  font-family:var(--serif);font-size:9px;line-height:1.3;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold);opacity:.9;
}
.screen-cast{position:relative;z-index:1}
.title{
  font-family:var(--serif);font-weight:400;font-size:clamp(38px,11.5vw,48px);line-height:1.05;
  margin:14px 0 8px;color:var(--bone);letter-spacing:-.01em;text-align:center;
  text-shadow:0 2px 24px rgba(0,0,0,.6);
}
.sub{
  margin:0 auto;max-width:224px;font-size:14px;line-height:1.4;color:var(--bone-dim);text-align:center;
  text-shadow:0 1px 12px rgba(0,0,0,.7);
}
.altar-space{height:calc(var(--hero-h) - var(--head-h) - 150px);min-height:110px}

/* ---- Fields ---- */
.field{display:block;margin:0 0 16px;position:relative}
.field-label,.section-label{
  display:block;font-size:16px;font-weight:500;color:var(--bone);margin:0 0 10px;letter-spacing:.005em;
}
.control{position:relative}
.control input,.control textarea{
  width:100%;font-size:17px;line-height:1.4;color:var(--bone);font-weight:400;
  background:linear-gradient(180deg,#1B1615,#151110);border:1px solid var(--line);border-radius:var(--r-ctrl);
  padding:15px 48px 15px 18px;outline:none;-webkit-appearance:none;appearance:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.25);
  transition:border-color var(--dur),box-shadow var(--dur);
}
.control textarea{min-height:104px;resize:none;display:block;overflow:hidden}
.control input:focus,.control textarea:focus{
  border-color:rgba(229,38,47,.55);
  box-shadow:0 0 0 3px rgba(179,18,31,.16),0 0 26px rgba(179,18,31,.14),inset 0 1px 0 rgba(255,255,255,.03);
}
.control input::placeholder,.control textarea::placeholder{color:var(--bone-mute);font-weight:400}
.control .clear-btn{
  position:absolute;right:13px;top:14px;width:26px;height:26px;border-radius:50%;display:none;place-items:center;
  background:rgba(237,228,214,.10);color:var(--bone-dim);transition:background var(--dur),color var(--dur);
}
.control.single .clear-btn{top:50%;transform:translateY(-50%)}
.control.single .clear-btn:active{transform:translateY(-50%) scale(.94)}
.control .clear-btn svg{width:12px;height:12px}
.control.has-value .clear-btn{display:grid}
.control .clear-btn:hover{background:rgba(237,228,214,.18);color:var(--bone)}
.counter{
  display:block;text-align:right;font-size:12px;color:var(--bone-mute);margin-top:6px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.counter.max{color:var(--blood-hot)}
.empty-hint{
  display:block;margin:2px 0 0;font-size:12px;color:var(--blood-hot);opacity:0;max-height:0;overflow:hidden;
  transition:opacity var(--dur),max-height var(--dur);
}
.empty-hint.show{opacity:1;max-height:2em}
.control.pulse-inner input,.control.pulse-inner textarea{animation:pulseInner .7s var(--ease)}
@keyframes pulseInner{
  0%,100%{box-shadow:0 0 0 0 transparent;border-color:var(--line)}
  30%{box-shadow:0 0 0 4px rgba(229,38,47,.3);border-color:var(--blood-hot)}
  60%{box-shadow:0 0 0 2px rgba(229,38,47,.16);border-color:var(--blood)}
}

/* ---- Power cards (segmented) ---- */
.power{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;
  border-radius:var(--r-card);border:1px solid var(--line);margin:0 0 14px;
  background:linear-gradient(180deg,#171312,#100D0C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.28);
}
.pow{
  position:relative;min-height:98px;border-radius:14px;border:1px solid transparent;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:16px 3px 13px;color:var(--bone-dim);text-align:center;overflow:hidden;
  transition:border-color var(--dur),color var(--dur),background var(--dur),box-shadow var(--dur),transform var(--dur) var(--ease);
}
.pow:hover,.pow:focus-visible{background:rgba(237,228,214,.03)}
.pow .ico{width:22px;height:22px;display:block;margin-bottom:5px;color:var(--bone-dim)}
.pow .ico svg{width:100%;height:100%;display:block}
.pow b{font-size:15px;font-weight:600;color:var(--bone);letter-spacing:0;line-height:1.2;white-space:nowrap}
.pow small{font-size:10.5px;color:var(--bone-mute);line-height:1.3;white-space:nowrap;letter-spacing:-.01em}
@media (max-width:359px){
  .pow b{font-size:13.5px}
  .pow small{font-size:9.5px}
}
.pow .check{
  position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;display:none;place-items:center;
  background:var(--blood-hot);color:#fff;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.pow .check svg{width:10px;height:10px}
.pow.on{
  color:var(--bone);border-color:rgba(229,38,47,.55);
  background:radial-gradient(120% 110% at 50% 0%,#8E1119 0%,#5C0B12 58%,#3F080D 100%);
  box-shadow:inset 0 0 0 1px rgba(229,38,47,.16),inset 0 1px 0 rgba(255,255,255,.08),0 8px 26px rgba(179,18,31,.3);
}
.pow.on .ico{color:var(--bone)}
.pow.on small{color:rgba(237,228,214,.72)}
.pow.on .check{display:grid}
.pow.on::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(229,38,47,.28),transparent 70%);
  animation:innerPulse 2.6s ease-in-out infinite;
}
.pow[data-id="whisper"].on::after{animation-duration:4s;opacity:.6}
.pow[data-id="anathema"].on{
  box-shadow:inset 0 0 0 1px rgba(255,59,47,.35),inset 0 1px 0 rgba(255,255,255,.08),0 0 28px rgba(255,59,47,.32),0 10px 30px rgba(179,18,31,.28);
  animation:anathemaBreathe var(--dur-breathe) ease-in-out infinite;
}
.pow[data-id="anathema"].on::after{animation-duration:1.2s}
@keyframes innerPulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes anathemaBreathe{
  0%,100%{transform:scale(1);box-shadow:inset 0 0 0 1px rgba(255,59,47,.35),0 0 22px rgba(255,59,47,.24),0 10px 30px rgba(179,18,31,.22)}
  50%{transform:scale(1.025);box-shadow:inset 0 0 0 1px rgba(255,59,47,.55),0 0 38px rgba(255,59,47,.4),0 12px 36px rgba(179,18,31,.3)}
}

/* ---- Без мата toggle ---- */
.toggle-row{
  display:flex;align-items:center;gap:12px;padding:13px 14px 13px 12px;margin:0 0 26px;
  border-radius:var(--r-card);border:1px solid var(--line);
  background:linear-gradient(180deg,#171312,#100D0C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.28);
}
.toggle-ico{
  width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(237,228,214,.06);border:1px solid var(--line);color:var(--bone-dim);
}
.toggle-ico svg{width:18px;height:18px}
.toggle-text{flex:1;min-width:0;text-align:left}
.toggle-text b{display:block;font-size:15px;font-weight:600;color:var(--bone);line-height:1.25}
.toggle-text small{display:block;font-size:11px;color:var(--bone-mute);margin-top:2px;line-height:1.3}
.switch{
  width:51px;height:31px;border-radius:var(--r-pill);flex:none;position:relative;
  background:rgba(237,228,214,.14);transition:background var(--dur),box-shadow var(--dur);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#F4EDE2;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform var(--dur) var(--ease),background var(--dur);
}
.switch[aria-checked="true"]{background:linear-gradient(180deg,#D21B26,#9F0F1A);box-shadow:0 0 18px rgba(179,18,31,.38)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:active{transform:none}

/* ---- CTA pill ---- */
.cta{
  width:100%;min-height:64px;border-radius:var(--r-pill);position:relative;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:22px;font-weight:400;color:var(--bone);letter-spacing:.005em;
  background:radial-gradient(120% 170% at 50% 0%,#B8141F 0%,#7E0D15 58%,#520810 100%);
  border:1px solid rgba(255,96,96,.5);
  box-shadow:0 0 0 4px rgba(179,18,31,.12),0 0 36px rgba(179,18,31,.45),0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
  margin:0 0 22px;z-index:1;padding:0 56px;
  transition:transform 150ms var(--ease),box-shadow var(--dur),filter var(--dur),opacity var(--dur);
}
.cta::before{
  content:"";position:absolute;inset:-8px;border-radius:var(--r-pill);pointer-events:none;
  box-shadow:0 0 44px 8px rgba(179,18,31,.26);animation:ctaBreathe 3.4s ease-in-out infinite;
}
@keyframes ctaBreathe{0%,100%{opacity:.55}50%{opacity:1}}
.cta .arrow{position:absolute;right:22px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--bone)}
.cta:active:not(:disabled){transform:scale(.985);filter:brightness(1.08)}
.cta:disabled{opacity:.55;cursor:not-allowed}
.cta.busy{opacity:.8}

.footer-line{
  display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 0;
  font-family:var(--serif);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dim);
}
.footer-line::before,.footer-line::after{content:"";height:1px;flex:1;max-width:56px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.footer-line::after{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.footer-line span{white-space:nowrap}

/* ---- Result ---- */
.verdict{display:none;position:relative;z-index:2;margin-top:6px}
.verdict.show{display:block!important;opacity:1!important;visibility:visible!important}
body.is-result .overlay{display:none!important;opacity:0!important;pointer-events:none!important}
.v-eyebrow{
  font-family:var(--serif);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  text-align:center;margin:22px 0 10px;
}
.cursed-name{
  font-family:var(--serif);font-weight:400;font-size:clamp(30px,8.6vw,38px);line-height:1.1;text-align:center;
  color:var(--bone);margin:0 0 12px;word-break:break-word;letter-spacing:-.01em;
}
.meta-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.power-tag{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-pill);
  border:1px solid rgba(229,38,47,.5);color:#F2A7A7;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  background:rgba(179,18,31,.14);box-shadow:0 0 14px rgba(179,18,31,.14);
}
.power-tag[data-power="whisper"]{border-color:rgba(166,90,85,.55);color:#DCAAA4;background:rgba(166,90,85,.12);box-shadow:none}
.power-tag[data-power="anathema"]{border-color:rgba(255,59,47,.65);color:#FFB8AE;background:rgba(255,59,47,.16);box-shadow:0 0 18px rgba(255,59,47,.28)}
.v-frame{
  position:relative;border:1px solid rgba(179,18,31,.5);border-radius:22px;padding:26px 20px 22px;
  background:linear-gradient(180deg,rgba(26,14,13,.94),rgba(12,9,8,.96));
  box-shadow:0 0 44px rgba(179,18,31,.14),0 22px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden;
}
.v-frame::before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,74,.18);border-radius:15px;pointer-events:none;
}
.v-frame::after{

.block{margin:0 0 14px;text-align:center;position:relative;z-index:1}
.block-label{

.v-situation{

}
.v-situation[hidden]{display:none}
.block.punch-block{margin-bottom:16px;padding-top:12px;border-top:1px solid rgba(201,162,74,.14)}
.block-setup{margin:0 0 6px;font-size:13px;color:var(--bone-dim);line-height:1.4}
.block-setup[hidden]{display:none}
.block.punch-block .block-body{

}
.block.lift{margin-bottom:0;padding-top:12px;border-top:1px solid rgba(201,162,74,.14)}

}
.red-flash{

    const points = new THREE.Points(pGeo, pMat);
    scene.add(points);

    threeState = {
      active: true,
      renderer: renderer,
      scene: scene,
      camera: camera,
      orb: orb,
      orbMat: orbMat,
      rings: rings,
      points: points,
      glowMap: glowMap,
      velocities: velocities,
      fx: fx,
      shake: 0,
      baseCam: { x: 0, y: 0, z: 6.2 },
      raf: 0,
      t0: performance.now()
    };

    function onResize(){
      if(!threeState || !threeState.active) return;
      const ww = innerWidth, hh = innerHeight;
      camera.aspect = ww / hh;
      camera.updateProjectionMatrix();
      const cap = ww < 500 ? 1.5 : 2;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, cap));
      renderer.setSize(ww, hh);
    }
    threeState.onResize = onResize;
    window.addEventListener("resize", onResize);

    function onContextLost(e){
      e.preventDefault();
      const savedFx = (threeState && threeState.fx) || fx;
      disposeThree();
      sealStage.classList.remove("three-mode");
      sealStage.classList.add("svg-fallback");
      canvas.style.display = "";
      if(overlay.classList.contains("on")){
        startAsh(savedFx);
      }
    }
    function onContextRestored(){
      if(overlay.classList.contains("on") && casting && !threeState){
        const restartFx = fxTable[powerId] || fxTable.seal || fx;
        stopAsh();
        startThreeRitual(restartFx);
      }
    }
    renderer.domElement.addEventListener("webglcontextlost", onContextLost, false);
    renderer.domElement.addEventListener("webglcontextrestored", onContextRestored, false);
    threeState.onContextLost = onContextLost;
    threeState.onContextRestored = onContextRestored;

    function tick(){
      if(!threeState || !threeState.active) return;
      const st = threeState;
      const t = (performance.now() - st.t0) / 1000;
      const pulse = 1 + Math.sin(t * (1.6 + st.fx.spin)) * (0.04 + st.fx.glow * 0.06);
      st.orb.scale.setScalar(pulse * (st.orb.userData.scaleBoost || 1));
      st.orbMat.opacity = Math.min(0.98, (0.7 + st.fx.glow * 0.18) * (0.82 + 0.18 * Math.sin(t * 3)));

      for(let i=0;i<st.rings.length;i++){
        const r = st.rings[i];
        r.rotation.z += r.userData.spin;
        r.rotation.y += r.userData.spinY;
      }

      const pos = st.points.geometry.attributes.position.array;
      for(let pi=0;pi<st.velocities.length;pi++){
        const v = st.velocities[pi];
        v.th += v.sp;
        v.ph += v.sp * 0.35;
        pos[pi*3] = Math.cos(v.th) * Math.cos(v.ph) * v.rr;
        pos[pi*3+1] = Math.sin(v.ph) * v.rr * 0.6;
        pos[pi*3+2] = Math.sin(v.th) * Math.cos(v.ph) * v.rr;
      }
      st.points.geometry.attributes.position.needsUpdate = true;
      st.points.rotation.y += 0.002 * st.fx.spin;

      const sh = st.shake || 0;
      if(sh > 0.01){
        st.camera.position.x = st.baseCam.x + (Math.random() - 0.5) * sh * 0.04;
        st.camera.position.y = st.baseCam.y + (Math.random() - 0.5) * sh * 0.04;
        st.shake *= 0.92;
      } else {
        st.camera.position.x = st.baseCam.x;
        st.camera.position.y = st.baseCam.y;
      }
      st.renderer.render(st.scene, st.camera);
      st.raf = requestAnimationFrame(tick);
    }
    tick();
    return true;
  }

  /* ---------- share poster (1080×1920, Meta Stories safe band) ---------- */
  function wrapText(ctx, text, maxW){
    const words = String(text || "").split(/\s+/);
    const lines = [];
    let line = "";
    for(let i=0;i<words.length;i++){
      const test = line ? line + " " + words[i] : words[i];
      if(ctx.measureText(test).width > maxW && line){
        lines.push(line);
        line = words[i];
      } else line = test;
    }
    if(line) lines.push(line);
    return lines;
  }
  function drawRoundedRect(ctx, x, y, w, h, r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function addGrain(ctx, x, y, w, h, dens){
    const n = dens || 1800;
    ctx.save();
    for(let i=0;i<n;i++){
      const gx = x + Math.random() * w;
      const gy = y + Math.random() * h;
      const a = 0.02 + Math.random() * 0.06;
      ctx.fillStyle = Math.random() > .5 ? "rgba(255,255,255," + a + ")" : "rgba(0,0,0," + a + ")";
      ctx.fillRect(gx, gy, 1.5, 1.5);
    }
    ctx.restore();
  }
  function setSpacing(ctx, px){
    try{ if("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }catch(e){}
  }
  function powerColorOf(pid){
    return pid === "anathema" ? "#FF3B2F" : pid === "whisper" ? "#C98A84" : "#E5262F";
  }
  function drawCrown(ctx, cx, cy, w, color){
    const h = w * 0.72;
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - w/2, cy + h*0.45);
    ctx.lineTo(cx - w*0.36, cy - h*0.2);
    ctx.lineTo(cx - w*0.16, cy + h*0.05);
    ctx.lineTo(cx, cy - h*0.5);
    ctx.lineTo(cx + w*0.16, cy + h*0.05);
    ctx.lineTo(cx + w*0.36, cy - h*0.2);
    ctx.lineTo(cx + w/2, cy + h*0.45);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(cx - w/2, cy + h*0.5, w, Math.max(2, h*0.14));
    ctx.restore();
  }
  // Occult sigil: glowing concentric rune rings + gold crown (poster art)
  function drawSigil(ctx, cx, cy, r, color, glow){
    ctx.save();
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.1);
    grd.addColorStop(0, "rgba(179,18,31," + (0.22 * glow) + ")");
    grd.addColorStop(1, "rgba(179,18,31,0)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 1.1, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    const stone = ctx.createLinearGradient(cx, cy - r*0.42, cx, cy + r*0.42);
    stone.addColorStop(0, "#241D1A");
    stone.addColorStop(1, "#0E0B0A");
    ctx.fillStyle = stone;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = color;
    ctx.shadowBlur = 26 * glow;
    for(let i=0;i<3;i++){
      const k = 1 - i * 0.24;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 0.9 * k, r * 0.42 * 0.9 * k, 0, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.9 - i * 0.2;
      ctx.lineWidth = i === 0 ? 3 : 2;
      ctx.stroke();
    }
    ctx.globalAlpha = .7;
    ctx.lineWidth = 2;
    for(let k=0;k<40;k++){
      const a = k / 40 * Math.PI * 2;
      const rx1 = r * 0.9, ry1 = r * 0.42 * 0.9, rx2 = r * 0.8, ry2 = r * 0.42 * 0.8;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * rx1, cy + Math.sin(a) * ry1);
      ctx.lineTo(cx + Math.cos(a) * rx2, cy + Math.sin(a) * ry2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    drawCrown(ctx, cx, cy - r * 0.08, r * 0.34, "#C9A24A");
    ctx.restore();
  }

  function shortPunch(punch, maxLen){
    const lim = (maxLen == null) ? 280 : maxLen;
    const t = String(punch || "").replace(/^А\s+/i, "").trim();
    if(t.length <= lim) return t;
    const cut = t.slice(0, lim - 1);
    const sp = cut.lastIndexOf(" ");
    return (sp > Math.floor(lim * 0.45) ? cut.slice(0, sp) : cut) + "…";
  }

  function buildCurseText(v, withUrl){
    if(!v) return "";
    const lines = [v.name + " · " + v.powerLabel];
    if(v.situation) lines.push("«" + v.situation + "»");
    lines.push(v.punch, formatLift(v.lift), "", "ПРОКЛИНАТОР");
    if(withUrl) lines.push(APP_URL);
    return lines.join("\n");
  }

  function paintPoster(){
    const W = 1080, H = 1920;
    exportCanvas.width = W;
    exportCanvas.height = H;
    const ctx = exportCanvas.getContext("2d");
    if(!ctx || !lastVerdict) return exportCanvas;

    const powerColor = powerColorOf(lastVerdict.powerId);
    const glow = lastVerdict.powerId === "anathema" ? 1.4 : lastVerdict.powerId === "whisper" ? 0.7 : 1;

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#110C0B");
    bg.addColorStop(0.45, "#0B0908");
    bg.addColorStop(1, "#070505");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    const haze = ctx.createRadialGradient(W/2, H*0.22, 40, W/2, H*0.3, 760);
    haze.addColorStop(0, "rgba(140,14,24," + (0.26 * glow) + ")");
    haze.addColorStop(1, "rgba(11,9,8,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);
    addGrain(ctx, 0, 0, W, H, 5000);

    // Meta Stories/Reels safe zone: TOP ~14%, BOTTOM ~35%, SIDES ~6%.
    // contentSafeY = [0.14H, 0.65H] — everything that matters stays inside.
    const pad = Math.max(64, Math.floor(W * 0.06));
    const contentSafeTop = Math.floor(H * 0.14);
    const contentSafeBot = Math.floor(H * 0.65);
    const maxY = contentSafeBot;

    const innerPad = pad + 56;
    const textW = W - innerPad * 2;
    let y = contentSafeTop + 52;

    ctx.textAlign = "center";
    ctx.textBaseline = "top";

    // Brand
    drawCrown(ctx, W/2, y + 14, 46, "#C9A24A");
    y += 48;
    ctx.fillStyle = "rgba(237,228,214,.9)";
    ctx.font = "400 26px " + SERIF_CANVAS;
    setSpacing(ctx, 8);
    ctx.fillText("ПРОКЛИНАТОР", W/2, y);
    y += 36;
    ctx.fillStyle = "rgba(201,162,74,.85)";
    ctx.font = "400 15px " + SERIF_CANVAS;
    setSpacing(ctx, 6);
    ctx.fillText(String(DATA.tagline || "").toUpperCase(), W/2, y);
    setSpacing(ctx, 0);
    y += 46;

    const fullPunch = shortPunch(lastVerdict.punch, 320);
    const longPunch = String(fullPunch).length > 110;
    const hasSituation = !!lastVerdict.situation;

    // Sigil art — drop for long punches to keep everything in the safe band
    if(!longPunch){
      const r = Math.floor(W * 0.2);
      const artH = Math.floor(r * 0.42 * 2 + 40);
      const room = maxY - y;
      if(artH < room * 0.34){
        drawSigil(ctx, W/2, y + artH/2, r, powerColor, glow);
        y += artH + 14;
      }
    }

    // Sin
    ctx.fillStyle = "rgba(201,162,74,.75)";
    ctx.font = "600 15px " + SANS_CANVAS;
    setSpacing(ctx, 5);
    ctx.fillText(String(blocks[0] || "ГРЕХ").toUpperCase(), W/2, y);
    setSpacing(ctx, 0);
    y += 26;
    ctx.fillStyle = "rgba(237,228,214,.78)";
    ctx.font = "600 26px " + SANS_CANVAS;
    const sinLines = wrapText(ctx, String(lastVerdict.sin || ""), textW);
    for(let si=0; si<Math.min(sinLines.length, 2); si++){
      if(y + 32 > maxY) break;
      ctx.fillText(sinLines[si], W/2, y);
      y += 32;
    }
    y += 12;

    // Situation quote (≤2 lines)
    if(hasSituation){
      ctx.fillStyle = "rgba(237,228,214,.5)";
      ctx.font = "italic 400 24px " + SERIF_CANVAS;
      const qLines = wrapText(ctx, "«" + lastVerdict.situation + "»", textW);
      const qMax = Math.min(qLines.length, 2);
      for(let qi=0; qi<qMax; qi++){
        if(y + 30 > maxY - 200) break;
        let ln = qLines[qi];
        if(qi === qMax - 1 && qLines.length > qMax) ln = ln.replace(/[»]?$/, "…»");
        ctx.fillText(ln, W/2, y);
        y += 30;
      }
      y += 14;
    }

    // Punch (hero, serif)
    ctx.fillStyle = "#EDE4D6";
    let punchFont = 44, punchLH = 56;
    ctx.font = "400 " + punchFont + "px " + SERIF_CANVAS;
    let punchLines = wrapText(ctx, fullPunch, textW);
    if(punchLines.length > 5 || y + punchLines.length * punchLH > maxY - 170){
      punchFont = 36; punchLH = 46;
      ctx.font = "400 " + punchFont + "px " + SERIF_CANVAS;
      punchLines = wrapText(ctx, fullPunch, textW);
    }
    if(punchLines.length > 6 || y + Math.min(punchLines.length, 7) * punchLH > maxY - 150){
      punchFont = 30; punchLH = 38;
      ctx.font = "400 " + punchFont + "px " + SERIF_CANVAS;
      punchLines = wrapText(ctx, fullPunch, textW);
    }
    let maxPunchLines = 7;
    while(maxPunchLines > 3 && y + maxPunchLines * punchLH > maxY - 140){
      maxPunchLines--;
    }
    for(let pi=0; pi<Math.min(punchLines.length, maxPunchLines); pi++){
      ctx.fillText(punchLines[pi], W/2, y);
      y += punchLH;
    }
    y += 18;

    // Lift — bone @.85 for AA contrast on soot
    ctx.fillStyle = "rgba(237,228,214,.85)";
    ctx.font = "500 24px " + SANS_CANVAS;
    const botLines = wrapText(ctx, formatLift(lastVerdict.lift), textW);
    for(let bi=0; bi<Math.min(botLines.length, 2); bi++){
      if(y + 30 > maxY) break;
      ctx.fillText(botLines[bi], W/2, y);
      y += 30;
    }
    y += 22;

    // Name + power tag
    ctx.fillStyle = "#EDE4D6";
    ctx.font = "600 40px " + SERIF_CANVAS;
    const nameLines = wrapText(ctx, String(lastVerdict.name || ""), textW);
    for(let ni=0; ni<Math.min(nameLines.length, 2); ni++){
      if(y + 50 > maxY + 8) break;
      ctx.fillText(nameLines[ni], W/2, y);
      y += 50;
    }
    y += 6;
    if(y + 28 <= maxY + 12){
      ctx.fillStyle = powerColor;
      ctx.font = "700 20px " + SANS_CANVAS;
      setSpacing(ctx, 5);
      ctx.fillText(String(lastVerdict.powerLabel || "").toUpperCase(), W/2, y);
      setSpacing(ctx, 0);
      y += 30;
      ctx.strokeStyle = powerColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W/2 - 56, y);
      ctx.lineTo(W/2 + 56, y);
      ctx.stroke();
    }

    // Ornamental frame hugs the content (blood outer, gold hairline inner); never leaves the safe band
    const frameBot = Math.min(contentSafeBot, Math.max(y + 64, contentSafeTop + Math.floor(H * 0.34)));
    ctx.save();
    ctx.strokeStyle = "rgba(179,18,31,.75)";
    ctx.lineWidth = 3;
    drawRoundedRect(ctx, pad, contentSafeTop, W - pad * 2, frameBot - contentSafeTop, 44);
    ctx.stroke();
    ctx.strokeStyle = "rgba(201,162,74,.28)";
    ctx.lineWidth = 1.5;
    drawRoundedRect(ctx, pad + 14, contentSafeTop + 14, W - pad * 2 - 28, frameBot - contentSafeTop - 28, 34);
    ctx.stroke();
    ctx.restore();

    // Footer may sit in the platform-chrome zone (non-critical)
    ctx.fillStyle = "rgba(201,162,74,.45)";
    ctx.font = "400 18px " + SERIF_CANVAS;
    setSpacing(ctx, 6);
    ctx.fillText(String(DATA.footer || "").toUpperCase(), W/2, H - Math.floor(H * 0.1));
    setSpacing(ctx, 0);
    ctx.fillStyle = "rgba(237,228,214,.3)";
    ctx.font = "500 20px " + SANS_CANVAS;
    ctx.fillText(APP_URL.replace(/^https?:\/\//, "").replace(/\/$/, ""), W/2, H - Math.floor(H * 0.07));

    return exportCanvas;
  }

  // Landscape OG card 1200×630 — downloadable companion; static Pages og:image is hero-altar.jpg

    g.addColorStop(1, "rgba(11,9,8,0)");

    ctx.fillText("ПРОКЛИНАТОР", W/2, 98);

    let y = 150;
    ctx.fillStyle = "rgba(201,162,74,.8)";
    ctx.font = "600 20px " + SANS_CANVAS;

    y += 40;

    ctx.fillStyle = "#EDE4D6";
    ctx.font = "400 40px " + SERIF_CANVAS;

      y += 50;

    ctx.fillStyle = "rgba(237,228,214,.85)";
    ctx.font = "600 28px " + SERIF_CANVAS;
    ctx.fillText(String(lastVerdict.name || ""), W/2, y);
    y += 40;
    ctx.fillStyle = powerColor;
    ctx.font = "700 16px " + SANS_CANVAS;
    setSpacing(ctx, 4);
    ctx.fillText(String(lastVerdict.powerLabel || "").toUpperCase(), W/2, y);
    setSpacing(ctx, 0);

    ctx.fillStyle = "rgba(201,162,74,.5)";
    ctx.font = "400 16px " + SERIF_CANVAS;
    setSpacing(ctx, 5);
    ctx.fillText(String(DATA.footer || "").toUpperCase(), W/2, H - 70);
    setSpacing(ctx, 0);

    return ogCanvas;
  }

  async function prefetchShareBlob(){
    shareBlob = null;
    ogBlob = null;
    if(!lastVerdict) return;
    try{
      await waitFonts(800);
      paintPoster();
      shareBlob = await new Promise(function(res){ exportCanvas.toBlob(res, "image/png"); });
      paintOgCard();
      ogBlob = await new Promise(function(res){ ogCanvas.toBlob(res, "image/png"); });
    }catch(e){ shareBlob = null; ogBlob = null; }
  }

  function downloadPng(canvasEl, filename){
    canvasEl.toBlob(function(blob){
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || "proklinator.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    }, "image/png");
  }

      }
      if(blob && navigator.share){
        const file = new File([blob], "proklinator.png", { type: "image/png" });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: "ПРОКЛИНАТОР", text: shareText, url: APP_URL });
          showToast(DATA.toastShare);
          return;
        }
        await navigator.share({ title: "ПРОКЛИНАТОР", text: shareText, url: APP_URL });
        showToast(DATA.toastShare);
        return;
      }
    }catch(e){
      if(e && e.name === "AbortError") return;
    }
    if(!shareBlob){
      await waitFonts(800);
      paintPoster();
    }
    downloadPng(exportCanvas, "proklinator-" + (lastVerdict.sinId || "card") + ".png");
    const copied = await copyText(shareText);
    if(!copied) showToast(DATA.toastShare);
  }

  /* ---------- result ---------- */
  function typewriterPunch(el, text, opts){
    opts = opts || {};
    if(typewriterTimer){ clearTimeout(typewriterTimer); typewriterTimer = 0; }
    text = String(text || "");
    if(!el) return;
    if(reduced || !text.length){
      el.textContent = text;
      return;
    }
    el.textContent = "";
    const n = text.length;
    const total = Math.min(1200, Math.max(180, Math.floor(n * 16)));
    const per = Math.max(8, Math.floor(total / n));
    let i = 0;
    const haptic = !!opts.haptic;
    function step(){
      i++;
      el.textContent = text.slice(0, i);
      if(haptic && i % 5 === 0) vibe(8);
      if(i < n){
        typewriterTimer = setTimeout(step, per);
      } else {
        typewriterTimer = 0;
        el.textContent = text;
      }
    }
    step();
  }

  function showResult(){
    hardCloseOverlay();
    castScreen.classList.add("hidden");
    result.classList.remove("hidden");
    result.classList.add("show");
    document.body.classList.add("is-result");
    $("vName").textContent = lastVerdict.name;
    $("vPower").textContent = lastVerdict.powerLabel;
    $("vPower").dataset.power = lastVerdict.powerId || "";
    $("vSin").textContent = lastVerdict.sin;

    const sitEl = $("vSituation");
    if(lastVerdict.situation){
      sitEl.hidden = false;
      sitEl.textContent = "«" + lastVerdict.situation + "»";
    } else {
      sitEl.hidden = true;
      sitEl.textContent = "";
    }

    const setup = (lastVerdict.setup || "").trim();
    const squash = function(s){ return String(s || "").toLowerCase().replace(/[«»"'.,!?…\s]+/g, " ").trim(); };
    const setupDup = !setup || squash(setup) === squash(lastVerdict.sin);
    if(setup && !setupDup){
      $("vSetup").hidden = false;
      $("vSetup").textContent = setup;
    } else {
      $("vSetup").hidden = true;
      $("vSetup").textContent = "";
    }
    $("lblLift").textContent = formatLiftLabel(lastVerdict.lift);
    $("vLift").textContent = formatLift(lastVerdict.lift);

    const stampSvg = $("stampMark").querySelector("svg");
    if(stampSvg){
      const sc = powerColorOf(lastVerdict.powerId);
      stampSvg.querySelectorAll(".ring-s").forEach(function(el){ el.setAttribute("stroke", sc); });
    }

    result.classList.remove("flash-anathema");
    const flash = $("redFlash");
    if(flash){ flash.classList.remove("on"); void flash.offsetWidth; }

    const punchEl = $("vPunch");
    const hard = lastVerdict.powerId === "anathema";
    punchEl.style.opacity = "1";
    punchEl.style.transform = "none";

    const stamp = $("stampMark");
    const nameEl = $("vName");
    if(!reduced && hasAnime){
      stamp.style.opacity = "0"; stamp.style.transform = "scale(2.6) rotate(-14deg)";
      nameEl.style.opacity = "0"; nameEl.style.transform = "translateY(8px)";

      if(hard && flash){
        flash.classList.add("on");
        result.classList.add("flash-anathema");
      }

      anime.timeline({ easing: "easeOutExpo" })
        .add({ targets: nameEl, opacity: [0, 1], translateY: [10, 0], duration: 380 })
        .add({
          targets: stamp,
          opacity: [0, 1],
          scale: hard ? [3.2, 1] : [2.4, 1],
          rotate: hard ? [-18, 0] : [-12, 0],
          duration: hard ? 520 : 420,
          easing: hard ? "easeOutElastic(1, .55)" : "easeOutBack(1.4)"
        }, "-=120");

      if(hard){
        anime({
          targets: result,
          translateX: [
            { value: -10, duration: 40 },
            { value: 12, duration: 50 },
            { value: -8, duration: 45 },
            { value: 6, duration: 40 },
            { value: 0, duration: 60 }
          ],
          easing: "easeInOutSine"
        });
      }
      setTimeout(function(){
        typewriterPunch(punchEl, lastVerdict.punch, { haptic: hard });
      }, hard ? 280 : 180);
    } else {
      stamp.style.opacity = "1"; stamp.style.transform = "none";
      nameEl.style.opacity = "1"; nameEl.style.transform = "none";
      typewriterPunch(punchEl, lastVerdict.punch, { haptic: false });
    }

    prefetchShareBlob();
    showToast(DATA.toastOk);
    try{ window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); }catch(e){ window.scrollTo(0, 0); }
  }

  function runRitual(name, situation){
    casting = true;
    cast.disabled = true;
    cast.classList.add("busy");
    castText.textContent = DATA.busy;

    const fx = Object.assign({
      spin: 1, glow: 0.7, particles: 56, shake: 6,
      duration: 3200, rings: 4, vibrate: 0, color: "#B3121F"
    }, fxTable[powerId] || fxTable.seal || {});

    const gender = inferGender(name, situation);
    const matchedSin = situation ? matchSin(situation, name, noMat) : null;
    const picked = pickVerdict({ sin: matchedSin, gender: gender, powerId: powerId, clean: noMat });
    const verd = picked.verd;
    const sin = picked.sin;
    const power = powers.find(function(p){ return p.id === powerId; }) || powers[1];
    const setup = verd.setup ? conjugate(fillName(verd.setup, name), gender) : "";
    const punch = conjugate(fillName(picked.punchRaw, name), gender);
    const lift = conjugate(fillName(verd.lift, name), gender);

    lastVerdict = {
      name: name,
      situation: situation,
      gender: gender,
      sin: sin.name,
      sinId: sin.id,
      category: sin.category,
      sinObj: sin,
      setup: setup,
      punch: punch,
      lift: lift,
      powerId: powerId,
      powerLabel: power.label,
      usedPower: picked.usedPower,
      clean: noMat,
      matched: !!matchedSin,
      verdId: verd.id
    };

    let chants = (ritualByPower[powerId] || DATA.ritual || []).slice();
    if(!chants.length) chants = DATA.ritual || ["Готово."];

    openOverlay(fx);

    const duration = reduced ? 400 : Math.max(1200, fx.duration | 0);
    const step = duration / Math.max(1, chants.length);
    progress.style.width = "0%";
    chant.textContent = fillChant(chants[0], name, gender);

    function finish(){
      casting = false;
      if(threeState && threeState.orb){
        threeState.orb.userData.scaleBoost = 1.35;
        threeState.shake = fx.shake;
      }
      setTimeout(function(){ showResult(); }, reduced ? 60 : 220);
    }

    if(reduced){
      overlay.style.opacity = "1";
      progress.style.width = "100%";
      chant.textContent = fillChant(chants[chants.length - 1], name, gender);
      setTimeout(finish, 320);
      return;
    }

    if(hasAnime){
      const prog = { w: 0 };
      const chantIdx = { i: 0 };
      const tl = anime.timeline({ easing: "easeOutQuad", complete: finish });
      ritualTimeline = tl;
      tl.add({ targets: overlay, opacity: [0, 1], duration: 280 })
        .add({
          targets: prog, w: 100, duration: duration, easing: "linear",
          update: function(){ progress.style.width = prog.w + "%"; }
        }, 0)
        .add({
          targets: chantIdx, i: chants.length - 1, duration: duration, easing: "linear", round: 1,
          update: function(){
            const idx = Math.min(chants.length - 1, chantIdx.i | 0);
            chant.textContent = fillChant(chants[idx], name, gender);
          }
        }, 0);

      if(threeState && threeState.orb){
        tl.add({
          targets: threeState.orb.scale,
          x: [0.7, 1], y: [0.7, 1], z: [0.7, 1],
          duration: 600,
          easing: "easeOutElastic(1, .6)"
        }, 0);
        anime({
          targets: threeState.orb.userData,
          scaleBoost: [1, 1.08, 1],
          duration: Math.min(1200, duration / 2),
          loop: Math.max(1, Math.floor(duration / 1200)),
          easing: "easeInOutSine"
        });
        if(powerId === "anathema" || fx.shake > 8){
          anime({
            targets: threeState,
            shake: [fx.shake, fx.shake * 0.4, fx.shake],
            duration: duration,
            easing: "easeInOutSine"
          });
        }
      } else {
        tl.add({
          targets: sealStage,
          scale: [0.86, 1.05, 0.96],
          opacity: [0.7, 1],
          duration: Math.min(900, duration * 0.4),
          easing: "easeOutQuad"
        }, 0);
      }

      tl.add({ targets: progress, opacity: [1, 0.4, 1], duration: 280, easing: "easeInOutQuad" });
    } else {
      if(!reduced){
        overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: "ease-out", fill: "forwards" });
      } else {
        overlay.style.opacity = "1";
      }
      let i = 0;
      function next(){
        i++;
        const pct = Math.min(100, (i / chants.length) * 100);
        progress.style.width = pct + "%";
        if(i >= chants.length){
          chant.textContent = fillChant(chants[chants.length - 1], name, gender);
          setTimeout(finish, 280);
          return;
        }
        chant.textContent = fillChant(chants[i], name, gender);
        setTimeout(next, step);
      }
      setTimeout(next, step);
    }
  }

  function readForm(){
    return {
      name: (who.value || "").replace(/\s+/g, " ").trim().slice(0, WHO_MAX),
      situation: (what.value || "").replace(/\s+/g, " ").trim().slice(0, WHAT_MAX)
    };
  }

  cast.addEventListener("click", function(){
    if(casting) return;
    const f = readForm();
    if(!f.name){ failEmpty(); return; }
    emptyHint.classList.remove("show");
    runRitual(f.name, f.situation);
  });

  who.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      e.preventDefault();
      if((what.value || "").trim()) cast.click();
      else { try{ what.focus(); }catch(err){} }
    }
  });
  what.addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); cast.click(); }
  });

  function backToForm(){
    hardCloseOverlay();
    shareBlob = null;
    if(typewriterTimer){ clearTimeout(typewriterTimer); typewriterTimer = 0; }
    result.classList.remove("show");
    result.classList.remove("flash-anathema");
    result.classList.add("hidden");
    castScreen.classList.remove("hidden");
    document.body.classList.remove("is-result");
    cast.disabled = false;
    cast.classList.remove("busy");
    castText.textContent = DATA.cta;
  }

  $("resetBtn").addEventListener("click", function(){
    if(casting) return;
    const wasResult = document.body.classList.contains("is-result");
    backToForm();
    if(!wasResult){
      who.value = "";
      what.value = "";
      updateWho();
      updateWhat();
      emptyHint.classList.remove("show");
    }
    vibe(VIBE.light);
    try{ window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); }catch(e){ window.scrollTo(0, 0); }
  });

  $("saveBtn").addEventListener("click", async function(){
    if(!lastVerdict) return;
    await waitFonts(800);
    paintPoster();
    downloadPng(exportCanvas, "proklinator-" + (lastVerdict.sinId || "card") + ".png");
    showToast(DATA.toastShare);
  });
  $("shareBtn").addEventListener("click", function(){ shareCard(); });
  $("copyCurseBtn").addEventListener("click", async function(){
    if(!lastVerdict) return;
    const text = buildCurseText(lastVerdict, true);
    const ok = await copyText(text);
    if(!ok){
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        showToast(DATA.toastCopy);
      }catch(e){}
    }
  });
  $("againBtn").addEventListener("click", function(){
    if(casting) return;
    const f = readForm();
    const name = f.name || (lastVerdict && lastVerdict.name) || "";
    const situation = f.situation || (lastVerdict && lastVerdict.situation) || "";
    if(!name){
      backToForm();
      try{ who.focus(); }catch(e){}
      return;
    }
    // Same who/what/power — new verdict only; the overlay covers the stale card until showResult refills it
    hardCloseOverlay();
    shareBlob = null;
    if(typewriterTimer){ clearTimeout(typewriterTimer); typewriterTimer = 0; }
    result.classList.remove("flash-anathema");
    document.body.classList.remove("is-result");
    vibe(VIBE.whisper);
    runRitual(name, situation);
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden && !casting){
      stopAsh();
    }
  });

  // Exposed for smoke tests / debugging only
  try{
    window.__proklinator = {
      matchSin: matchSin, isVulgar: isVulgar, inferGender: inferGender, pickVerdict: pickVerdict,
      paintPoster: paintPoster, paintOgCard: paintOgCard, conjugate: conjugate,
      version: DATA.version, get last(){ return lastVerdict; }
    };
  }catch(e){}
})();
</script>
</body>
